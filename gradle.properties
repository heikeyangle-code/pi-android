# Memory is the binding constraint on this project's build machine (a phone:
# ~1.5 GB free). Keep the Gradle JVM small, one worker, no extra daemon.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.daemon.jvmargs=-Xmx768m
kotlin.incremental=false
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# pi's runtime executables are shipped disguised as lib*.so (Android 10+ denies
# execve on app_data_file). They MUST be extracted to nativeLibraryDir on
# install, never memory-mapped straight out of the APK.
android.packagingOptions.jniLibs.useLegacyPackaging=true
