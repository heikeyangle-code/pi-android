<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none';">
<title>pi mermaid render host</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  #pi-stage {
    position: absolute;
    left: 0;
    top: 0;
    display: block;
    padding: 14px;
    box-sizing: border-box;
    transform-origin: 0 0;
    background: transparent;
    overflow: visible;
  }
  #pi-stage svg {
    display: block;
    overflow: visible;
    max-width: none !important;
  }
</style>
</head>
<body>
<div id="pi-stage"></div>
<script src="mermaid.min.js"></script>
<script>
/*
 * Kotlin <-> Mermaid 12.2.0 bridge for PiMermaidRenderEngine.
 *
 * Supports two modes:
 *  - htmlLabels = true (default): renders full HTML/CSS3/CJK Mermaid diagrams into #pi-stage
 *    with strict viewport/DPR calibration so Chromium/Skia rasterizes crisp high-DPI bitmaps
 *    directly via WebView.draw(Canvas).
 *  - htmlLabels = false (fallback): emits sanitized pure SVG for AndroidSVG fallback.
 */
(function () {
  "use strict";

  var TASKS = Object.create(null);
  var SCALE_READY = Object.create(null);
  var MAX_SVG_CHARS = 2 * 1024 * 1024;
  var SVG_NS = "http://www.w3.org/2000/svg";
  var STAGE_PADDING = 14;

  function describe(error) {
    if (!error) return "unknown error";
    if (typeof error === "string") return error;
    if (error.str) return String(error.str);
    if (error.message) return String(error.message);
    return String(error);
  }

  function hasMermaid() {
    return typeof window.mermaid !== "undefined" && window.mermaid !== null;
  }

  function color(value, fallback) {
    var text = String(value || "");
    return /^#[0-9a-fA-F]{6}$/.test(text) ? text : fallback;
  }

  function hexToRgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function rgbToHex(r, g, b) {
    function ch(v) {
      var s = Math.max(0, Math.min(255, Math.round(v))).toString(16);
      return s.length === 1 ? "0" + s : s;
    }
    return "#" + ch(r) + ch(g) + ch(b);
  }

  function mixHex(a, b, weightB) {
    var ra = hexToRgb(a);
    var rb = hexToRgb(b);
    var wa = 1 - weightB;
    return rgbToHex(
      ra[0] * wa + rb[0] * weightB,
      ra[1] * wa + rb[1] * weightB,
      ra[2] * wa + rb[2] * weightB
    );
  }

  function fontFamily(value) {
    var cleaned = String(value || "").replace(/[^A-Za-z0-9 ,_-]/g, "").trim();
    return cleaned || "sans-serif";
  }

  function config(theme, width, htmlLabels) {
    theme = theme || {};
    var background = color(theme.background, "#18181b");
    var foreground = color(theme.foreground, "#e4e4e7");
    var accent = color(theme.accent, "#7aa7f7");
    var muted = color(theme.muted, "#a1a1aa");
    var font = fontFamily(theme.fontFamily);
    var useHtml = htmlLabels !== false;
    var wrap = Math.max(160, Math.min(480, (width | 0) || 300));
    var ganttWidth = Math.max(360, Math.min(2000, (width | 0) || 540));

    var bgRgb = hexToRgb(background);
    var isLight = (0.299 * bgRgb[0] + 0.587 * bgRgb[1] + 0.114 * bgRgb[2]) > 140;
    var nodeFill = isLight ? mixHex(background, "#ffffff", 0.72) : mixHex(background, foreground, 0.085);
    var secondaryFill = isLight ? mixHex(background, accent, 0.10) : mixHex(background, accent, 0.15);
    var tertiaryFill = isLight ? mixHex(background, foreground, 0.04) : mixHex(background, foreground, 0.055);
    var clusterFill = isLight ? mixHex(background, foreground, 0.03) : mixHex(background, foreground, 0.035);
    var borderSoft = mixHex(background, accent, isLight ? 0.72 : 0.72);
    var edgeLabelBg = isLight ? mixHex(background, "#ffffff", 0.88) : mixHex(background, foreground, 0.07);
    var noteFill = isLight ? mixHex(background, accent, 0.10) : mixHex(background, accent, 0.14);
    var gridTone = mixHex(background, muted, 0.35);

    // Distinct, luminance-harmonized categorical series for pie / gitGraph / mindmap / xychart
    var series = isLight
      ? [accent, "#0f766e", "#b45309", "#7c3aed", "#be123c", "#0369a1", "#4d7c0f", "#6d28d9"]
      : [accent, "#34d399", "#fbbf24", "#c084fc", "#fb7185", "#38bdf8", "#a3e635", "#f472b6"];

    return {
      startOnLoad: false,
      securityLevel: "strict",
      htmlLabels: useHtml,
      theme: "base",
      themeVariables: {
        darkMode: !isLight,
        background: background,
        primaryColor: nodeFill,
        primaryTextColor: foreground,
        primaryBorderColor: borderSoft,
        secondaryColor: secondaryFill,
        secondaryTextColor: foreground,
        secondaryBorderColor: muted,
        tertiaryColor: tertiaryFill,
        tertiaryTextColor: foreground,
        tertiaryBorderColor: muted,
        lineColor: muted,
        textColor: foreground,
        mainBkg: nodeFill,
        nodeBkg: nodeFill,
        nodeBorder: borderSoft,
        nodeTextColor: foreground,
        clusterBkg: clusterFill,
        clusterBorder: mixHex(background, muted, 0.55),
        edgeLabelBackground: edgeLabelBg,
        titleColor: foreground,
        actorBkg: nodeFill,
        actorBorder: borderSoft,
        actorTextColor: foreground,
        actorLineColor: muted,
        signalColor: foreground,
        signalTextColor: foreground,
        labelBoxBkgColor: secondaryFill,
        labelBoxBorderColor: borderSoft,
        labelTextColor: foreground,
        noteBkgColor: noteFill,
        noteTextColor: foreground,
        noteBorderColor: borderSoft,
        activationBkgColor: secondaryFill,
        activationBorderColor: borderSoft,
        sectionBkgColor: tertiaryFill,
        altSectionBkgColor: clusterFill,
        sectionBkgColor2: secondaryFill,
        gridColor: gridTone,
        taskBkgColor: secondaryFill,
        taskBorderColor: borderSoft,
        taskTextColor: foreground,
        taskTextDarkColor: foreground,
        taskTextOutsideColor: foreground,
        activeTaskBkgColor: mixHex(background, accent, 0.30),
        activeTaskBorderColor: accent,
        doneTaskBkgColor: tertiaryFill,
        doneTaskBorderColor: muted,
        pieStrokeColor: background,
        pieTitleTextColor: foreground,
        pieSectionTextColor: isLight ? "#111827" : "#0b0f17",
        pieLegendTextColor: foreground,
        pie1: series[0],
        pie2: series[1],
        pie3: series[2],
        pie4: series[3],
        pie5: series[4],
        pie6: series[5],
        pie7: series[6],
        pie8: series[7],
        git0: series[0],
        git1: series[1],
        git2: series[2],
        git3: series[3],
        git4: series[4],
        git5: series[5],
        git6: series[6],
        git7: series[7],
        gitBranchLabel0: foreground,
        gitBranchLabel1: foreground,
        gitBranchLabel2: foreground,
        gitBranchLabel3: foreground,
        commitLabelColor: foreground,
        commitLabelBackground: edgeLabelBg,
        cScale0: secondaryFill,
        cScale1: mixHex(background, series[1], 0.22),
        cScale2: mixHex(background, series[2], 0.22),
        cScale3: mixHex(background, series[3], 0.22),
        cScale4: mixHex(background, series[4], 0.22),
        cScale5: mixHex(background, series[5], 0.22),
        cScale6: mixHex(background, series[6], 0.22),
        cScale7: mixHex(background, series[7], 0.22),
        cScaleLabel0: foreground,
        cScaleLabel1: foreground,
        cScaleLabel2: foreground,
        cScaleLabel3: foreground,
        cScaleLabel4: foreground,
        cScaleLabel5: foreground,
        cScaleLabel6: foreground,
        cScaleLabel7: foreground,
        xyChart: {
          backgroundColor: "transparent",
          titleColor: foreground,
          xAxisLabelColor: foreground,
          xAxisTitleColor: foreground,
          xAxisTickColor: muted,
          xAxisLineColor: muted,
          yAxisLabelColor: foreground,
          yAxisTitleColor: foreground,
          yAxisTickColor: muted,
          yAxisLineColor: muted,
          plotColorPalette: series.join(",")
        },
        fontFamily: font,
        fontSize: "14px"
      },
      themeCSS:
        ".node rect, .node polygon, .node circle, .node ellipse { stroke-width: 1.4px; } " +
        ".node rect { rx: 8px; ry: 8px; } " +
        ".cluster rect { rx: 10px; ry: 10px; stroke-width: 1.2px; } " +
        ".edgePath .path { stroke-width: 1.5px; } " +
        ".actor { rx: 8px; ry: 8px; stroke-width: 1.4px; }",
      fontFamily: font,
      maxTextSize: 64 * 1024,
      maxEdges: 500,
      suppressErrorRendering: true,
      deterministicIds: true,
      logLevel: "fatal",
      flowchart: {
        htmlLabels: useHtml,
        useMaxWidth: false,
        wrappingWidth: wrap,
        curve: "basis",
        padding: 14,
        nodeSpacing: 36,
        rankSpacing: 44
      },
      sequence: { useMaxWidth: false, mirrorActors: false, boxMargin: 10, messageMargin: 32 },
      class: { useMaxWidth: false, htmlLabels: useHtml },
      state: { useMaxWidth: false },
      er: { useMaxWidth: false },
      journey: { useMaxWidth: false },
      pie: { useMaxWidth: false },
      gantt: { useMaxWidth: false, useWidth: ganttWidth },
      mindmap: { useMaxWidth: false },
      timeline: { useMaxWidth: false },
      gitGraph: { useMaxWidth: false },
      quadrantChart: { useMaxWidth: false },
      sankey: { useMaxWidth: false },
      xychart: { useMaxWidth: false },
      kanban: { useMaxWidth: false },
      packet: { useMaxWidth: false },
      block: { useMaxWidth: false },
      architecture: { useMaxWidth: false },
      requirement: { useMaxWidth: false },
      c4: { useMaxWidth: false }
    };
  }

  function parseAbsPx(raw) {
    if (!raw) return 0;
    var s = String(raw).trim();
    // Explicitly reject relative CSS units (e.g. width="100%" must NEVER parse as 100px!)
    if (!/^[0-9]+(?:\.[0-9]+)?(?:px)?$/i.test(s)) return 0;
    var n = parseFloat(s);
    return isFinite(n) && n > 0 ? n : 0;
  }

  function measure(svg) {
    var rootMatch = /<svg[^>]*>/i.exec(svg);
    var rootTag = rootMatch ? rootMatch[0] : svg.slice(0, 600);
    var viewBox = /viewBox\s*=\s*["']([^"']*)["']/i.exec(rootTag);
    if (viewBox) {
      var parts = viewBox[1].trim().split(/[\s,]+/).map(Number);
      if (parts.length === 4 && isFinite(parts[0]) && isFinite(parts[1]) &&
          isFinite(parts[2]) && isFinite(parts[3]) &&
          parts[2] > 0 && parts[3] > 0) {
        return {
          minX: parts[0],
          minY: parts[1],
          width: Math.ceil(parts[2]),
          height: Math.ceil(parts[3])
        };
      }
    }
    var wAttr = /width\s*=\s*["']([^"']+)["']/i.exec(rootTag);
    var hAttr = /height\s*=\s*["']([^"']+)["']/i.exec(rootTag);
    var wPx = parseAbsPx(wAttr && wAttr[1]);
    var hPx = parseAbsPx(hAttr && hAttr[1]);
    if (wPx > 0 && hPx > 0) {
      return { minX: 0, minY: 0, width: Math.ceil(wPx), height: Math.ceil(hPx) };
    }
    var maxWMatch = /max-width\s*:\s*([0-9.]+)px/i.exec(rootTag);
    if (maxWMatch) {
      var mw = parseFloat(maxWMatch[1]);
      if (isFinite(mw) && mw > 0) {
        var mh = hPx > 0 ? hPx : Math.ceil(mw * 0.65);
        return { minX: 0, minY: 0, width: Math.ceil(mw), height: Math.ceil(mh) };
      }
    }
    return { minX: 0, minY: 0, width: 0, height: 0 };
  }

  function cleanup(taskId) {
    var ids = ["dpi-svg-" + taskId, "pi-svg-" + taskId];
    for (var i = 0; i < ids.length; i++) {
      try {
        var el = document.getElementById(ids[i]);
        if (el && el.parentNode && el.parentNode.id !== "pi-stage") {
          el.parentNode.removeChild(el);
        }
      } catch (ignored) {}
    }
    try {
      var tips = document.querySelectorAll(".mermaidTooltip");
      for (var j = 0; j < tips.length; j++) {
        if (tips[j].parentNode) tips[j].parentNode.removeChild(tips[j]);
      }
    } catch (ignored) {}
  }

  function clearStage() {
    var stage = document.getElementById("pi-stage");
    if (stage) {
      stage.innerHTML = "";
      stage.style.transform = "";
      stage.style.width = "";
      stage.style.height = "";
    }
  }

  function finish(taskId, svg, useHtml) {
    cleanup(taskId);
    if (typeof svg !== "string" || svg.length === 0) {
      fail(taskId, "mermaid produced no svg");
      return;
    }
    if (svg.length > MAX_SVG_CHARS) {
      fail(taskId, "svg exceeds 2 MiB");
      return;
    }
    var size = measure(svg);
    var dpr = (typeof window.devicePixelRatio === "number" && isFinite(window.devicePixelRatio) && window.devicePixelRatio > 0)
      ? window.devicePixelRatio
      : 1;

    if (!useHtml) {
      clearStage();
      TASKS[taskId] = {
        state: "ok",
        svg: svg,
        width: size.width,
        height: size.height,
        stageWidth: 0,
        stageHeight: 0,
        stageReady: false,
        dpr: dpr
      };
      return;
    }

    try {
      var stage = document.getElementById("pi-stage");
      stage.style.transform = "";
      stage.style.width = "max-content";
      stage.style.height = "max-content";
      stage.innerHTML = svg;
      var svgEl = stage.querySelector("svg");
      var w = size.width;
      var h = size.height;
      var minX = size.minX || 0;
      var minY = size.minY || 0;

      if (svgEl) {
        svgEl.style.maxWidth = "none";
        if (w > 0 && h > 0) {
          if (!svgEl.getAttribute("viewBox")) {
            svgEl.setAttribute("viewBox", minX + " " + minY + " " + w + " " + h);
          }
          svgEl.setAttribute("width", String(w));
          svgEl.setAttribute("height", String(h));
          svgEl.style.width = w + "px";
          svgEl.style.height = h + "px";
        }
        try {
          var bbox = svgEl.getBBox();
          if (bbox && isFinite(bbox.width) && isFinite(bbox.height) && bbox.width > 1 && bbox.height > 1) {
            var pad = 8;
            if (w <= 16 || h <= 16) {
              // Mermaid emitted a degenerate/tiny viewBox (e.g. -8 -8 16 16): trust actual bbox!
              minX = bbox.x - pad;
              minY = bbox.y - pad;
              w = Math.ceil(bbox.width + pad * 2);
              h = Math.ceil(bbox.height + pad * 2);
              svgEl.setAttribute("viewBox", minX + " " + minY + " " + w + " " + h);
              svgEl.setAttribute("width", String(w));
              svgEl.setAttribute("height", String(h));
              svgEl.style.width = w + "px";
              svgEl.style.height = h + "px";
            } else {
              // Expand slightly if labels/arrowheads overhang, while ignoring pathological >6x hidden-defs outliers
              var saneBbox = bbox.width < w * 6 && bbox.height < h * 6 &&
                Math.abs(bbox.x - minX) < w * 3 && Math.abs(bbox.y - minY) < h * 3;
              if (saneBbox) {
                var bx = Math.min(minX, bbox.x - pad);
                var by = Math.min(minY, bbox.y - pad);
                var br = Math.max(minX + w, bbox.x + bbox.width + pad);
                var bb = Math.max(minY + h, bbox.y + bbox.height + pad);
                var fullW = Math.ceil(br - bx);
                var fullH = Math.ceil(bb - by);
                if (fullW > w + 2 || fullH > h + 2 || bx < minX - 2 || by < minY - 2) {
                  minX = bx;
                  minY = by;
                  w = fullW;
                  h = fullH;
                  svgEl.setAttribute("viewBox", minX + " " + minY + " " + w + " " + h);
                  svgEl.setAttribute("width", String(w));
                  svgEl.setAttribute("height", String(h));
                  svgEl.style.width = w + "px";
                  svgEl.style.height = h + "px";
                }
              }
            }
          }
        } catch (ignored) {}

        var rect = svgEl.getBoundingClientRect();
        if (w <= 0 || h <= 0) {
          if (rect && rect.width > 1 && rect.height > 1) {
            w = Math.ceil(rect.width);
            h = Math.ceil(rect.height);
            svgEl.setAttribute("width", String(w));
            svgEl.setAttribute("height", String(h));
            svgEl.style.width = w + "px";
            svgEl.style.height = h + "px";
          }
        }
      }

      if (w <= 0 || h <= 0) {
        clearStage();
        TASKS[taskId] = {
          state: "ok",
          svg: svg,
          width: size.width,
          height: size.height,
          stageWidth: 0,
          stageHeight: 0,
          stageReady: false,
          dpr: dpr
        };
        return;
      }

      var stageW = Math.max(1, w + STAGE_PADDING * 2);
      var stageH = Math.max(1, h + STAGE_PADDING * 2);
      stage.style.width = stageW + "px";
      stage.style.height = stageH + "px";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          TASKS[taskId] = {
            state: "ok",
            svg: svg,
            width: w,
            height: h,
            stageWidth: stageW,
            stageHeight: stageH,
            stageReady: true,
            dpr: dpr
          };
        });
      });
    } catch (error) {
      clearStage();
      TASKS[taskId] = {
        state: "ok",
        svg: svg,
        width: size.width,
        height: size.height,
        stageWidth: 0,
        stageHeight: 0,
        stageReady: false,
        dpr: dpr
      };
    }
  }

  function fail(taskId, message) {
    cleanup(taskId);
    clearStage();
    TASKS[taskId] = { state: "failed", error: String(message || "mermaid render failed") };
  }

  function metricsUsable() {
    var usable = false;
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("width", "200");
    svg.setAttribute("height", "40");
    svg.setAttribute("style", "position:absolute;left:0;top:0;visibility:hidden;");
    var text = document.createElementNS(SVG_NS, "text");
    text.setAttribute("x", "0");
    text.setAttribute("y", "30");
    text.setAttribute("font-size", "16");
    text.setAttribute("font-family", "sans-serif");
    text.textContent = "MMMM";
    svg.appendChild(text);
    try {
      document.body.appendChild(svg);
      var box = text.getBBox();
      usable = !!(box && box.width > 1 && box.height > 1);
    } catch (error) {
      usable = false;
    } finally {
      try {
        if (svg.parentNode) svg.parentNode.removeChild(svg);
      } catch (ignored) {}
    }
    return usable;
  }

  window.__piReady = function () {
    if (!hasMermaid()) {
      return { ok: false, error: "mermaid bundle did not define window.mermaid" };
    }
    var metrics = metricsUsable();
    try {
      window.mermaid.initialize(config({}, 360, true));
      return { ok: true, metrics: metrics, version: String(window.mermaid.version || "unknown") };
    } catch (error) {
      return { ok: false, error: "mermaid.initialize failed: " + describe(error) };
    }
  };

  window.__piSetStageScale = function (scale) {
    var stage = document.getElementById("pi-stage");
    if (!stage) return false;
    var s = Number(scale);
    if (!isFinite(s) || s <= 0) s = 1;
    stage.style.transform = "scale(" + s + ")";
    return true;
  };

  window.__piSetStageScaleAndFlush = function (scale, token) {
    SCALE_READY[token] = false;
    var ok = window.__piSetStageScale(scale);
    if (!ok) {
      SCALE_READY[token] = true;
      return false;
    }
    // Force synchronous layout flush + wait two frames so Chromium commits the scaled layer.
    var stage = document.getElementById("pi-stage");
    if (stage) void stage.offsetWidth;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        SCALE_READY[token] = true;
      });
    });
    return true;
  };

  window.__piScaleReady = function (token) {
    if (SCALE_READY[token]) {
      delete SCALE_READY[token];
      return true;
    }
    return false;
  };

  window.__piClearStage = function () {
    clearStage();
    return true;
  };

  window.__piRender = function (taskId, source, theme, width, htmlLabels) {
    var useHtml = htmlLabels !== false;
    TASKS[taskId] = { state: "pending" };
    if (!hasMermaid()) {
      fail(taskId, "mermaid bundle did not define window.mermaid");
      return true;
    }
    try {
      window.mermaid.initialize(config(theme, width, useHtml));
    } catch (error) {
      fail(taskId, "mermaid.initialize failed: " + describe(error));
      return true;
    }
    var text = String(source || "")
      .replace(/^\uFEFF/, "")
      .replace(/\r\n?/g, "\n")
      .replace(/%%\{[\s\S]*?\}%%/g, "")
      .trim();
    try {
      var rendered = window.mermaid.render("pi-svg-" + taskId, text);
      if (rendered && typeof rendered.then === "function") {
        rendered.then(
          function (output) { finish(taskId, output && output.svg, useHtml); },
          function (error) { fail(taskId, describe(error)); }
        );
      } else if (rendered && rendered.svg) {
        finish(taskId, rendered.svg, useHtml);
      } else {
        fail(taskId, "mermaid.render returned no svg");
      }
    } catch (error) {
      fail(taskId, describe(error));
    }
    return true;
  };

  window.__piPoll = function (taskId) {
    var task = TASKS[taskId];
    if (!task) return { ok: false, error: "unknown render task " + taskId };
    if (task.state === "pending") return null;
    delete TASKS[taskId];
    if (task.state === "ok") {
      return {
        ok: true,
        svg: task.svg,
        width: task.width,
        height: task.height,
        stageWidth: task.stageWidth || 0,
        stageHeight: task.stageHeight || 0,
        stageReady: !!task.stageReady,
        dpr: task.dpr || 1
      };
    }
    return { ok: false, error: task.error };
  };
})();
</script>
</body>
</html>
