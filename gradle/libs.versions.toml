[versions]
# Markdown is rendered by a third-party stack, never by hand:
#   org.jetbrains:markdown       — JetBrains' CommonMark + GFM parser (pure JVM)
#   com.mikepenz:…-renderer-m3   — Compose renderer for that parser's AST
# 0.45.0 is usable on AGP 8.13.2 with no AGP 9.x upgrade. Verified against the
# real artifacts and the AGP/sdklib jars in the module cache:
#   * the AAR asks for minCompileSdk=37 (+ minCompileMinorSdk=0). AGP 8.13.2 has
#     the minor-version DSL: `compileSdk = 37` + `compileSdkMinor = 0` resolves
#     to the `platforms;android-37.0` package. There is no plain android-37 —
#     repository2-3.xml only has 37.0/37.1/37.2 — so the minor property is not
#     optional. See app/build.gradle.kts.
#   * its classes are @Metadata mv=[2,2,0], same as 0.41.0, readable by the
#     Kotlin 2.2.21 pin below. A renderer built by Kotlin 2.3+ would force a
#     toolchain bump.
# Relative to 0.41.0 this brings GFM alerts (`> [!NOTE]`), the `alertTitle` slot
# in `MarkdownTypography`, `darkTheme` in `markdownColor`, and the
# `StreamingMarkdownState` overload. docs/known-gaps.md B9 has the evidence.
markdown = "0.45.0"

# AGP 8.13 is the stable line; the androidx versions below are the newest that
# still declare AGP 8.x in their AAR metadata. androidx releases from late 2025
# onwards require AGP 9.1+, which is a major-version upgrade with its own DSL
# changes — not worth taking on for a first working build.
agp = "8.13.2"
kotlin = "2.2.21"
coroutines = "1.9.0"
serializationJson = "1.9.0"
junit = "4.13.2"

composeBom = "2025.06.01"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.9.1"
documentfile = "1.0.1"
webkit = "1.13.0"
navigation = "2.9.0"

[libraries]
# --- protocol core ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

# --- android ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# --- markdown ---
# Only the m3 renderer is declared: it brings org.jetbrains:markdown (the
# parser), androidx.compose and kotlinx-collections-immutable transitively.
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
