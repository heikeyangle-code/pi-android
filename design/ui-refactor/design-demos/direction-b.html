<title>pi · 安卓客户端界面重构 · 方向 B（现实参照：Linear 移动端）</title>
<!--
================================================================================
方向 B · 现实参照（标杆迁移）—— pi 安卓客户端界面重构 · 方向初稿
================================================================================
【参照案例】Linear 的移动端（iOS / Android）。它是「开发者用的高密度工具界面」里做得最好的一档，
且刚在 2025 年 10 月重做过一次移动端的结构与视觉，方法论有第一手资料可查。

· 官方改版公告（2025-10-16）《Mobile app redesign》
  https://linear.app/changelog/2025-10-16-mobile-app-redesign
  原文事实：iOS 与 Android 换上一套新的视觉设计系统；导航重做成新的底部工具栏
  （a new bottom toolbar for quick access to core workflows）；每个屏顶部放一个主操作
  （"Create Issue" button at the top of every screen）。

· 团队设计复盘（2026-03-12）《A calmer interface for a product in motion》
  https://linear.app/now/behind-the-latest-design-refresh
  两条原则是逐字可引的：
  ① "Don't compete for attention you haven't earned" —— 支撑导航的 chrome 必须退后：
     侧栏调暗、图标变小、未激活文字降权、行距加大；tab 变紧凑而不是撑满整宽；
     减少图标数量、缩小尺寸、去掉彩色图标底。
  ② "Structure should be felt not seen" —— 分隔线太多太亮是噪音，改版把边界圆润化、
     对比软化，让结构"被感觉到"而不是"被看到"。
  调色事实：旧色偏冷蓝，改版走向更暖的灰；主题不再逐个定义 98 个变量，而由
  base / accent / contrast 三个输入生成，表面（background / panels / dialogs）用 elevation 别名分阶。

· 团队设计复盘（2024-03-28）《How we redesigned the Linear UI (part Ⅱ)》
  https://linear.app/now/how-we-redesigned-the-linear-ui
  原文事实：先抓「倒 L 形」全局 chrome（侧栏 + 顶部）来控制主内容区；目标写得很直白 ——
  reduce visual noise / maintain visual alignment / increase the hierarchy and density of
  navigation elements；动手前先做 environment / appearance / hierarchy 三组压力测试。

【为什么选它】pi 的手机端要解决的是同一类问题：一个信息密度极高的开发者工具，要塞进
412×892、单手、10cm 视距。Linear 移动端给出的答案正好是「底栏承载核心工作流 + 每屏一个主操作 +
紧凑属性行 + 就地直接操作」，与本次「直接操作 + 强层级」的取向同构。

【迁移的是方法论，不是外观 —— 这点是硬约束】
Linear 移动端这一版的核心 material 是毛玻璃景深；而 pi 已明确否决模糊 / 渐变 / 辉光
（空耗性能、无信息增益）。所以本版把它的 material 整个换掉，层级只由三样东西表达：
① 表面阶梯（page → surf-low → surf → surf-high）② 1px borderMuted 的 hairline
③ 字号 / 字重 / 对齐。这恰好就是它自己那条「Structure should be felt not seen」。
色值 100% 来自 pi 的主题令牌，没有搬运 Linear 的任何一个色值（连它标志性的暖灰都没搬）。

【拆解 → 迁移：五条】
1 倒 L 骨架 → 底栏三个目的地 + 每屏顶部一个主操作（对话 = 发送/停止；工作区 = 刷新现场；
  设置 = 搜索设置）。会话列表按产品裁决做成「对话页左上角进入的覆盖层」，不是第四个 tab。
2 注意力预算：chrome（顶栏 / 底栏）落到 --surf-dim，内容区留在 --page；一屏里只有当前项
  用 --accent，其余全部靠字号与对齐分层。图标只用 18px 单线，不做彩色图标底。
3 结构不被看见：分组 = 表面阶 + 组内 inset hairline，不用卡片描边、不用阴影、不用圆角描边堆叠。
4 属性即内容：每一行 = 标题 + 右对齐的属性（模型名 / 条数 / 耗时 / 退出码 / 增删行），
  数字一律 tabular-nums；状态永远带字（运行中 / 成功 / 失败）再配符号，不是只有颜色。
5 直接操作：列表行可选中、可左滑露出动作、可点开就地展开；输入 `/` 立刻出命令候选。

【对 pi 真实内容做的三个结构取舍（都写在页面里）】
· 对话流不再是一摞卡片墙：一串连续的工具调用画成一条**执行轨道**，节点就是真实状态字形
  （… ✓ ✗）+ 真实耗时读数（132ms / 88ms / 6.4 秒 / 已运行 12.3 秒 / 退出码 2）。
· 会话行的三行字段压成两行（标题 + 属性行），把「18 条 · 已命名」这类字段右对齐 ——
  密度来自对齐，不来自堆行。
· 工作区 = 项目的现场（当前目录、本目录的资源、改动、这次会话动过的文件）；
  终端按产品裁决降格成设置首页里的一个入口行。

【spec §11 五问】
1 叙事角色：对话 = hero；会话列表 = 选择器（覆盖层，不是地方）；工作区 = 数据（项目现场）；
  设置首页 = 结尾；设置分组页 = 结尾的细节层。
2 观众距离：10cm 单手。正文 14px、机器语言层 13px、标签 12px，一屏要放 6–8 个块。
3 视觉温度：冷静·精密。全篇没有一处靠「加色」表达层级，只有当前项与状态各占一次强调色。
4 容量估算：三个 5 秒 thumbnail —— ① 一条竖直执行轨道 + 右侧读数 ② 两行属性列表 + 分组计数
  ③ inset 行组 + 尾部值。836px 里 chrome 占 250px，内容区 586px → 6–8 块，成立。
5 视觉母题：**执行轨道**。pi 的工具调用是一条有序序列，每一步都带真实状态与真实耗时，
  edit 后面还必跟一块 diff —— 轨道就是这个序列的形状。form 来自内容：把「一摞卡片」
  换成「一条轨道 + 节点上的读数」，节点之间的连续性就是"这是同一个回合里连着跑的"。

【排版 / 颜色】颜色只取 pi 主题令牌；正文一律 --text（页面底上 11.9:1），12px 的次要标签用
--muted（4.5:1 边上，pi 自己的 meta 规则是 3:1，这里更高）；工具卡正文与 diff 上下文行用
pi 由对比度派生的 bodyOnTool / contextOnTool（#9E9E9E，在各工具底色上 4.97–5.44:1）。
字号只有 5 档：12 / 13 / 14 / 15 / 17。中文 fallback 链西文在前、中文在后。

【工具卡与 diff 里出现的路径】全部是用户自己项目的相对路径，界面上不出现本应用的文件路径、
类名或内部标记。
================================================================================
-->
<style>
  :root{
    /* ---- pi 主题令牌（dark）= 唯一色源，一个都没有改 ---- */
    --accent:#8ABEB7; --border:#5F87FF; --border-accent:#00D7FF; --border-muted:#505050;
    --success:#B5BD68; --error:#CC6666; --warning:#FFFF00;
    --text:#D4D4D4; --muted:#808080; --dim:#666666; --selected-bg:#3A3A4A;
    --user-bg:#343541; --user-text:#D4D4D4;
    --custom-bg:#2D2838; --custom-label:#9575CD;
    --tool-pending:#282832; --tool-success:#283228; --tool-error:#3C2828;
    --tool-title:#D4D4D4; --tool-output:#808080;
    --md-heading:#F0C674; --md-link:#81A2BE; --md-link-url:#666666;
    --md-code:#8ABEB7; --md-codeblock:#B5BD68; --md-codeblock-border:#808080;
    --md-quote:#808080; --md-hr:#808080; --md-bullet:#8ABEB7;
    --diff-add:#B5BD68; --diff-del:#CC6666; --diff-ctx:#808080;
    --syn-comment:#6A9955; --syn-keyword:#569CD6; --syn-function:#DCDCAA;
    --syn-variable:#9CDCFE; --syn-string:#CE9178; --syn-number:#B5CEA8;
    --syn-type:#4EC9B0; --syn-op:#D4D4D4;
    --think-off:#505050; --think-minimal:#6E6E6E; --think-low:#5F87AF;
    --think-medium:#81A2BE; --think-high:#B294BB; --think-xhigh:#D183E8; --think-max:#FF5FFF;
    --bash:#B5BD68;
    --page:#18181E; --card:#1E1E24; --info:#3C3728;
    --surf-low:#1E1E24; --surf:#232329; --surf-high:#29292F; --surf-highest:#303036; --surf-dim:#1C1C22;
    /* 由 toolOutput 抬到 4.5:1 的派生值（App 既有做法 bodyOnTool / contextOnTool） */
    --body-on-tool:#9E9E9E;
    --font-sans:"Geist","Inter","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    --font-mono:"Geist Mono","JetBrains Mono","Noto Sans Mono","Noto Sans CJK SC",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{margin:0;padding:0;background:#0e0e12}
  *{box-sizing:border-box}
  .b-page{
    font-family:var(--font-sans); color:var(--text); background:#0e0e12;
    font-synthesis:none; line-break:strict; overflow-wrap:anywhere; text-wrap:pretty;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .b-head{padding:40px 48px 0}
  .b-head-t{font-size:22px;font-weight:600;line-height:1.3;color:var(--text);letter-spacing:-0.01em}
  .b-head-s{font-size:13px;line-height:1.7;color:var(--muted);margin-top:8px;max-width:1180px}
  .b-head-s em{font-style:normal;color:var(--text)}
  .b-frames{display:flex;gap:32px;flex-wrap:wrap;padding:36px 48px 48px}
  @keyframes bIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes bFade{from{opacity:0}to{opacity:1}}
  @keyframes bRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .b-phone{display:flex;flex-direction:column;gap:10px;animation:bIn .5s cubic-bezier(.2,.7,.3,1) both}
  .b-cap{width:432px}
  .b-cap b{display:block;font-size:13px;font-weight:600;line-height:1.5;color:var(--text)}
  .b-cap span{display:block;font-size:13px;line-height:1.55;color:var(--muted);margin-top:2px}

  /* ---- 手机内：一块 412×836 的舞台 ---- */
  .b-root{
    position:relative;width:412px;height:836px;display:flex;flex-direction:column;overflow:hidden;
    background:var(--page);font-family:var(--font-sans);color:var(--text);
    font-synthesis:none;line-break:strict;overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums;text-wrap:pretty;-webkit-font-smoothing:antialiased;
  }
  .b-stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
  .b-screen{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--page)}
  .b-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
  .b-scroll::-webkit-scrollbar{width:3px}
  .b-scroll::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}
  .b-scroll::-webkit-scrollbar-track{background:transparent}
  .b-overlay{position:absolute;inset:0;z-index:6;background:var(--page);display:flex;flex-direction:column;animation:bFade .13s ease both}
  .b-sheetwrap{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;animation:bFade .13s ease both}
  .b-scrim{position:absolute;inset:0;background:rgba(0,0,0,.32)}
  .b-sheet{position:relative;background:var(--surf-high);border-top-left-radius:16px;border-top-right-radius:16px;border-top:1px solid var(--border-muted);max-height:76%;display:flex;flex-direction:column;animation:bRise .16s cubic-bezier(.2,.7,.3,1) both;box-shadow:none}
  .b-dlgwrap{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:22px;animation:bFade .13s ease both}
  .b-dlg{position:relative;width:100%;max-width:330px;background:var(--surf-high);border:1px solid var(--border-muted);border-radius:14px;padding:18px 16px 12px;animation:bRise .16s cubic-bezier(.2,.7,.3,1) both}

  /* ---- 字号 / 颜色工具类（只 5 档：12 / 13 / 14 / 15 / 17） ---- */
  .t12{font-size:12px;line-height:1.5}
  .t13{font-size:13px;line-height:1.55}
  .t14{font-size:14px;line-height:1.62}
  .t15{font-size:15px;line-height:1.4}
  .t17{font-size:17px;line-height:1.28}
  .w5{font-weight:500}.w6{font-weight:600}
  .mono{font-family:var(--font-mono)}
  .c-text{color:var(--text)}.c-muted{color:var(--muted)}.c-accent{color:var(--accent)}
  .c-succ{color:var(--success)}.c-err{color:var(--error)}.c-warn{color:var(--warning)}
  .c-link{color:var(--md-link)}.c-head{color:var(--md-heading)}.c-code{color:var(--md-code)}
  .c-body{color:var(--body-on-tool)}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fl1{flex:1;min-width:0}
  .rw{display:flex;align-items:center}
  .press{cursor:pointer}
  .press:hover{background-color:var(--surf)}
  .press2{cursor:pointer}
  .press2:hover{background-color:var(--surf-high)}
  .press3{cursor:pointer}
  .press3:hover{color:var(--text)}
  .b-root input{font-family:inherit;font-size:14px}
  .b-root input::placeholder{color:var(--muted);opacity:1}
  .div{height:1px;background:var(--border-muted);flex:none}
  .hair{height:1px;background:var(--border-muted);opacity:.55;flex:none}
</style>
</head>

<!-- ============ 设备框（超话 skill 的 android_frame.jsx，原样内联，未改一行） ============ -->
<script type="text/babel" data-presets="react">
/**
 * AndroidFrame — Android设备边框（参考Pixel 8系列）
 *
 * 含：punch-hole相机 + 状态栏 + 导航栏 + 圆角
 *
 * 用法：
 *   <AndroidFrame time="9:41" battery={85}>
 *     <YourAppContent />
 *   </AndroidFrame>
 */

const androidFrameStyles = {
  wrapper: {
    display: 'inline-block',
    padding: 10,
    background: '#1a1a1a',
    borderRadius: 44,
    boxShadow: '0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.3)',
    position: 'relative',
  },
  screen: {
    position: 'relative',
    borderRadius: 36,
    overflow: 'hidden',
    background: '#fff',
  },
  statusBar: {
    position: 'absolute',
    top: 0,
    left: 0,
    right: 0,
    height: 32,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'space-between',
    padding: '0 24px',
    fontSize: 14,
    fontWeight: 500,
    fontFamily: 'Roboto, -apple-system, sans-serif',
    zIndex: 20,
    pointerEvents: 'none',
  },
  punchHole: {
    position: 'absolute',
    top: 10,
    left: '50%',
    transform: 'translateX(-50%)',
    width: 14,
    height: 14,
    background: '#000',
    borderRadius: '50%',
    zIndex: 30,
  },
  statusIcons: {
    display: 'flex',
    alignItems: 'center',
    gap: 6,
  },
  batteryText: {
    fontSize: 11,
    fontWeight: 600,
    marginLeft: 2,
  },
  content: {
    position: 'absolute',
    top: 32,
    left: 0,
    right: 0,
    bottom: 24,
    overflow: 'auto',
  },
  navBar: {
    position: 'absolute',
    bottom: 0,
    left: 0,
    right: 0,
    height: 24,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'center',
    gap: 60,
    zIndex: 10,
  },
  navButton: {
    width: 36,
    height: 4,
    background: 'rgba(0,0,0,0.3)',
    borderRadius: 999,
  },
};

function AndroidFrame({
  children,
  width = 412,
  height = 892,
  time = '9:41',
  battery = 100,
  darkMode = false,
  navStyle = 'gesture',
}) {
  const textColor = darkMode ? '#fff' : '#1a1a1a';

  return (
    <div style={androidFrameStyles.wrapper}>
      <div style={{
        ...androidFrameStyles.screen,
        width,
        height,
        background: darkMode ? '#000' : '#fff',
      }}>
        <div style={{ ...androidFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={androidFrameStyles.statusIcons}>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
              <rect x="0" y="6" width="2" height="4" rx="0.5" />
              <rect x="4" y="4" width="2" height="6" rx="0.5" />
              <rect x="8" y="2" width="2" height="8" rx="0.5" />
              <rect x="12" y="0" width="2" height="10" rx="0.5" />
            </svg>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
              <path d="M7 9a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 6a5 5 0 018 0" stroke="currentColor" strokeWidth="1.2" />
              <path d="M0.5 3.5a11 11 0 0113 0" stroke="currentColor" strokeWidth="1.2" opacity="0.6" />
            </svg>
            <div style={{
              width: 22,
              height: 10,
              border: '1.5px solid currentColor',
              borderRadius: 2,
              padding: 1,
              position: 'relative',
            }}>
              <div style={{
                width: `${battery}%`,
                height: '100%',
                background: 'currentColor',
                borderRadius: 1,
              }} />
            </div>
            <span style={androidFrameStyles.batteryText}>{battery}%</span>
          </div>
        </div>

        <div style={androidFrameStyles.punchHole} />

        <div style={androidFrameStyles.content}>
          {children}
        </div>

        {navStyle === 'gesture' && (
          <div style={androidFrameStyles.navBar}>
            <div style={{
              ...androidFrameStyles.navButton,
              width: 100,
              height: 4,
              background: darkMode ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)',
            }} />
          </div>
        )}

        {navStyle === 'buttons' && (
          <div style={androidFrameStyles.navBar}>
            <span style={{ color: textColor, fontSize: 20 }}>◁</span>
            <span style={{ color: textColor, fontSize: 16 }}>○</span>
            <span style={{ color: textColor, fontSize: 16 }}>□</span>
          </div>
        )}
      </div>
    </div>
  );
}

if (typeof window !== 'undefined') {
  window.AndroidFrame = AndroidFrame;
}
</script>

})();

  /* 左滑露出动作：会话行的直接操作 */
  function SwipeRow(p){
    const [dx, setDx] = React.useState(0);
    const st = React.useRef(null);
    const onDown = e => { st.current = {x:e.clientX, base:dx, moved:false}; try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){} };
    const onMove = e => {
      if(!st.current) return;
      const d = st.current.base + (e.clientX - st.current.x);
      const cl = Math.max(-168, Math.min(0, d));
      if(Math.abs(e.clientX - st.current.x) > 4) st.current.moved = true;
      setDx(cl);
    };
    const onUp = () => { if(!st.current) return; const moved = st.current.moved; setDx(d=>d<-56?-168:0); st.current=null; if(!moved) p.onSelect(); };
    return (
      <div style={{position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:0,bottom:0,right:0,display:'flex',width:168}}>
          <div className="press2" onClick={()=>{setDx(0);p.onSelect();}}
            style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--surf-highest)',cursor:'pointer'}}>
            <span className="t12 c-text">新建子会话</span>
          </div>
          <div className="press2" onClick={()=>{setDx(0);p.onDelete();}}
            style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--surf-highest)',borderLeft:'1px solid var(--border-muted)',cursor:'pointer'}}>
            <span className="t12 c-err">删除</span>
          </div>
        </div>
        <div onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
          style={{position:'relative',transform:'translateX('+dx+'px)',background:p.selected?'var(--selected-bg)':'var(--surf-low)',
            padding:'10px 12px',cursor:'pointer',touchAction:'pan-y'}}>
          <div className="rw" style={{gap:7}}>
            <span className="t15 w5 ell fl1">{p.row.t}</span>
            {p.row.cur ? <Badge text="当前" tone="var(--accent)"/> : null}
            <span className="mono t12 c-muted" style={{flex:'none'}}>{p.row.time}</span>
          </div>
          <div className="rw" style={{marginTop:3,gap:8}}>
            <span className="t12 c-muted ell fl1">{p.row.sub}</span>

  /* ============================ ⑤ 设置的一个分组页 ============================ */
  function SettingsGroup(p){
    const [on, setOn] = React.useState({隐藏思考块:true, 缓存未命中提示:false});
    const [sheet, setSheet] = React.useState(null);
    const [opt, setOpt] = React.useState('默认模型');
    const [dlg, setDlg] = React.useState(null);
    const isProvider = opt.indexOf('厂商') >= 0;
    const PROVIDERS = ['DeepSeek','Anthropic','OpenAI','Z.ai','Moonshot AI','Qwen'];

    return (
      <div className="b-screen">
        <TopBar title="模型与推理" onBack={p.onBack}
          right={<div className="press" onClick={()=>{}} style={{width:30,height:30,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text)'}}><Icon n="search" s={17}/></div>}
        />
        <div className="b-scroll" style={{paddingBottom:18}}>
          {B_MODEL_ROWS.map(sec=>(
            <Section key={sec.sec} label={sec.sec} count={sec.rows.length+' 项'}>
              <Rows inset={14}>
                {sec.rows.map(r=>{
                  if(r.k==='switch'){
                    return (
                      <Row key={r.t} title={r.t} chevron={false}
                        trail={<Switch on={!!on[r.t]} onChange={v=>setOn(s=>Object.assign({},s,{[r.t]:v}))}/>}/>
                    );
                  }
                  const showBadge = r.badge ? {text:r.badge.text, tone:r.badge.tone} : null;
                  return (
                    <Row key={r.t}
                      title={r.t}
                      badge={showBadge}
                      value={r.k==='action' ? null : r.v}
                      valueMono={r.k!=='action'}
                      onClick={()=>{
                        if(r.k==='action') setDlg({title:r.t, kind:'action'});
                        else if(r.t==='默认思考等级') setSheet('think');
                        else if(r.k==='list') setSheet('list');
                        else if(r.badge && r.badge.text==='需重启引擎') setDlg({title:r.t, kind:'restart'});
                        else { setOpt(r.t); setSheet('option'); }
                      }}/>
                  );
                })}
              </Rows>
            </Section>
          ))}

          {/* 本版的结构提案：危险行固定在分组页末尾，随时可触达 */}
          <Section label="危险操作" count="1 项" aside="本版固定在页尾">
            <Rows inset={14}>
              <Row title="紧急停止" tone="var(--error)" chevron={false}
                meta="正在跑的回合与命令会立刻停下"
                trail={<span className="t13" style={{color:'var(--error)'}}>执行</span>}
                onClick={()=>setDlg({title:'紧急停止', kind:'danger'})}/>
            </Rows>
          </Section>

          <div className="t13 c-muted" style={{padding:'16px 14px 0',lineHeight:1.6}}>
            每一行末尾那枚徽标说明改动什么时候生效：新会话 / 需重载 / 需重启引擎。
          </div>
        </div>

        {/* 选项选择 */}
        <Sheet open={sheet==='option'} title={opt} sub={isProvider?'这一项决定新会话用哪家厂商。':'输入框里可以直接填模型名。'} onClose={()=>setSheet(null)}
          footer="这个列表来自运行中的引擎。">
          {isProvider ? PROVIDERS.map(n=>(
            <div key={n} className="press2" onClick={()=>setSheet(null)}
              style={{padding:'11px 14px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',background:n==='DeepSeek'?'var(--selected-bg)':'transparent'}}>
              <span className="t14 fl1">{n}</span>
              {n==='DeepSeek' ? <Badge text="当前" tone="var(--accent)"/> : null}
            </div>
          )) : B_MODELS.map(m=>(
            <div key={m.id} className="press2" onClick={()=>setSheet(null)}
              style={{padding:'9px 14px',cursor:'pointer',background:m.cur?'var(--selected-bg)':'transparent'}}>
              <div className="rw" style={{gap:8}}>
                <span className="mono t13 ell fl1">{m.id}</span>
                {m.cur ? <Badge text="当前" tone="var(--accent)"/> : null}
              </div>
              <div className="t12 c-muted" style={{marginTop:2}}>{m.p}</div>
            </div>
          ))}
        </Sheet>

        {/* 思考等级 */}
        <Sheet open={sheet==='think'} title="思考等级" sub="可选等级由当前模型决定。" onClose={()=>setSheet(null)}>
          <ThinkScale value="medium"/>
          {B_LEVELS.map(l=>(
            <div key={l.id} className="press2" onClick={()=>setSheet(null)}
              style={{padding:'9px 14px',display:'flex',alignItems:'center',gap:10,cursor:'pointer',background:l.id==='medium'?'var(--selected-bg)':'transparent'}}>
              <span style={{width:12,height:12,borderRadius:3,background:l.c,flex:'none'}}/>
              <span className="t14 fl1">{l.l}</span>
              {l.id==='medium' ? <Badge text="当前" tone="var(--accent)"/> : null}
            </div>
          ))}
        </Sheet>

        {/* 清单编辑器（Object 型说明逐字来自源码） */}
        <Sheet open={sheet==='list'} title="逐模型思考等级" sub="每行一项，写成「键 = 值」" onClose={()=>setSheet(null)}
          footer="键按精确匹配不认通配符。">
          <div style={{padding:'0 14px'}}>
            <div className="mono t13" style={{background:'var(--surf-highest)',border:'1px solid var(--border-muted)',borderRadius:9,padding:'10px 12px',lineHeight:'22px'}}>
              <div>deepseek/deepseek-reasoner = high</div>
              <div>anthropic/claude-sonnet-4-5 = medium</div>
            </div>
            <div className="t13 c-muted" style={{marginTop:10,lineHeight:1.6}}>
              每行一项，写成「键 = 值」，键按精确匹配不认通配符。值以 {'{'} 或 [ 开头时按 JSON 解析。
            </div>
            <div className="rw" style={{gap:8,marginTop:14,justifyContent:'flex-end'}}>
              <span className="press t13" onClick={()=>setSheet(null)} style={{padding:'7px 12px',borderRadius:8,cursor:'pointer'}}>取消</span>
              <span className="press t13" onClick={()=>setSheet(null)} style={{padding:'7px 12px',borderRadius:8,color:'var(--accent)',fontWeight:600,cursor:'pointer'}}>保存</span>
            </div>
          </div>
        </Sheet>

        {/* 生效方式 / 危险行的确认态 */}
        <Dialog open={!!dlg} title={dlg?dlg.title:''}
          onClose={()=>setDlg(null)}
          sub={dlg&&dlg.kind!=='danger' ? (dlg.kind==='restart'?'需要重启引擎':'需要新会话') : null}
          actions={dlg&&dlg.kind==='danger'
            ? [{label:'取消', onClick:()=>setDlg(null)},{label:'确认执行', primary:true, tone:'var(--error)', onClick:()=>setDlg(null)}]
            : (dlg&&dlg.kind==='restart'
              ? [{label:'稍后', onClick:()=>setDlg(null)},{label:'重启引擎', primary:true, onClick:()=>setDlg(null)}]
              : [{label:'取消', onClick:()=>setDlg(null)},{label:'执行', primary:true, onClick:()=>setDlg(null)}])}>
          {dlg ? (dlg.kind==='restart'
            ? '循环模型在引擎启动时确定，改完要重启引擎才会生效。'
            : dlg.kind==='danger'
              ? '正在跑的回合与命令会立刻停下，已写入磁盘的会话不会丢失。'
              : '「'+dlg.title+'」会打开对应的页面，文件与设置都已保存。') : null}
        </Dialog>
      </div>
    );
  }

  Object.assign(window, {ScreenChat:ChatScreen, ScreenSessions:SessionsOverlay, ScreenWorkbench:WorkbenchScreen, ScreenSettingsHome:SettingsHome, ScreenSettingsGroup:SettingsGroup});
})();
</script>

<!-- ============ 装配：每个目的地一台独立状态机 + 五台平铺 ============ -->
<script type="text/babel" data-presets="react">
(function(){
  const {TabBar} = window.BUI;

  function Phone(p){
    const [tab, setTab] = React.useState(p.start.tab);
    const [overlay, setOverlay] = React.useState(p.start.overlay || null);
    const [sub, setSub] = React.useState(p.start.sub || 'home');

    const goTab = k => { setTab(k); setOverlay(null); setSub('home'); };
    const [emptyDemo, setEmptyDemo] = React.useState(false);

    let screen = null;
    if(tab==='chat') screen = <window.ScreenChat onOpenSessions={()=>setOverlay('sessions')}/>;
    else if(tab==='workbench') screen = <window.ScreenWorkbench/>;
    else screen = sub==='group'
      ? <window.ScreenSettingsGroup onBack={()=>setSub('home')}/>
      : <window.ScreenSettingsHome onOpenGroup={()=>setSub('group')}/>;

    return (
      <div className="b-phone" style={{animationDelay:(p.i*70)+'ms'}}>
        <div className="b-cap">
          <b>{p.title}</b><span>{p.hint}</span>
          {p.demo ? (
            <span className="press" onClick={()=>setEmptyDemo(!emptyDemo)}
              style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:6,height:24,padding:'0 10px',borderRadius:999,cursor:'pointer',
                border:'1px solid '+(emptyDemo?'var(--border-accent)':'var(--border-muted)'),color:emptyDemo?'var(--accent)':'var(--muted)',fontSize:12}}>
              {'原型开关：'+(emptyDemo?'回到「会话列表」':'看「还没有会话」空态')}
            </span>
          ) : null}
        </div>
        <window.AndroidFrame width={412} height={892} darkMode time="9:41" battery={86}>
          <div className="b-root">
            <div className="b-stage">
              {screen}
              {overlay==='sessions' ? <window.ScreenSessions empty={emptyDemo} onClose={()=>setOverlay(null)}/> : null}
            </div>
            <TabBar active={tab} onChange={goTab}/>
          </div>
        </window.AndroidFrame>
      </div>
    );
  }

  function App(){
    const frames = [
      {i:0, start:{tab:'chat'}, title:'① 对话（hero）',
       hint:'点按工具行就地展开（read / grep / diff / bash 四种状态）；输入 / 实时过滤命令；右上「⋯」出会话菜单、模型 chip 出模型表；底部三项可切。'},
      {i:1, start:{tab:'chat', overlay:'sessions'}, demo:true, title:'② 会话列表（覆盖层）',
       hint:'从对话页左上角的会话名进入（覆盖层，不占 tab）；「会话 / 会话树」同层切换；点行选中并弹出会话操作，左滑露出动作；搜索框输入无结果词看「没有匹配的会话」空态；注释下的原型开关切到「还没有会话」空态。'},
      {i:2, start:{tab:'workbench'}, title:'③ 工作区（项目现场）',
