<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>pi 安卓客户端 · UI 重构方向 C · 作者性取向</title>

<!--
════════════════════════════════════════════════════════════════════
  方向 C · 🧠 最佳设计师（顶级定制）· 作者性取向
════════════════════════════════════════════════════════════════════

【我选了谁】Panic Inc.（Cabel Sasser）。选的是方法论，不是视觉皮。

理由（针对「这个开发者、这个产品」）：
1. Panic 三十年只干一件事：把开发者的工具当成一件要传下去的器物（Transmit / Nova / Prompt / Coda）。
   pi 的用户就是这群人——他不需要被取悦，他需要一件可信的仪器。这台手机是仪器的第二块表盘。
2. Panic 的看家本事是「让机器输出被尊重地排版」：等宽字当主角、数据排成读数、用 1px 线而不是卡片阴影
   切分信息。pi 的全部内容都是机器输出（命令、diff、行号、耗时、token），天生适配这套语言。
3. Panic 会给工具留一处幽默或仪式感，把它变成「有人的东西」（Transmit 的卡车、Nova 的启动音）。
   方向 C 只需要一处：120% 的签名细节，别处克制到 80%。
4. 排除其他候选：Teenage Engineering 的仪器感会带来硬件化装饰面，而这个产品的内容里没有可装饰的实体；
   原研哉的留白与本产品「高密度」的硬要求正面冲突（每屏要 ≥3 处真实差异化信息）；
   Rauno Freiberg 的交互精度是「手感」向，而本方向要的是「作者性」向，且手感无法在静态稿里被检验。

【启用的设计哲学（Panic 方法论的 4 条，逐条落到本稿）】
P1 工具即器物 → 一屏只讲一件事；控件有物理逻辑。转录不是「聊天气泡流」，是一条可以读的纸带。
P2 字体是唯一的材料 → 不用图标、不用阴影、不用渐变表达层级。层级只由字号、字重、1px 线、位置产生。
   两套字族：人类语言用无衬线，机器语言用等宽。禁止 emoji。
P3 颜色是信号不是装饰 → 整个产品只有一处发光：正在运行的那一步。状态永远三重编码：字 + 符号 + 颜色
   （运行中 … / 成功 ✓ / 失败 ✗）。
P4 一处仪式感 → 见下「签名细节」。

【母题：执行脊（The Spine）】
pi 的转录里天然存在一条别人没有的数据：每一步的耗时、diff 的增删行数、思考等级的颜色。
本稿把转录左缘做成一条连续的量尺（纸带），每个块挂在脊上：
· 工具卡节点 = 状态字形（… ✓ ✗）；刻度长度 = log(该步真实耗时)，并按量级分段（<1s 一段 / <10s 两段 / ≥10s 三段）；
· diff 节点 = 双条刻度，长度 = 真实的 +N / −N 行数；
· 思考块节点 = 4px 思考等级色条（pi 的 thinking 色温刻度就是这个产品自带的签名资产）；
· 散文用虚线（不是工作），工具与 diff 用实线（是工作）；上下文压缩处纸带断一次。
form 来自内容的哪里：来自工具卡页脚真实存在的「成功 · 132ms · 13 行」、diff 卡头的「+6 −5」、
思考块的等级色——不是套模板。收益：滚动时不看字就知道 agent 把时间花在哪、哪一步断了、现在卡在哪。

【signature 细节（120%）】执行脊的刻度语言本身。它只由真实数字驱动，且是全稿唯一的图形发明。
【其余克制到 80%】无卡片阴影、无图标、无渐变、无装饰动效（只有 hover 变色与 120ms 状态过渡）；
工具卡只有底色与 1px 线；列表靠行距、分组头与 1px 分隔线分层。

【对 spec §11 五问的回答】
1 叙事角色：对话是 hero（主战场）；会话列表是覆盖层上的索引；工作区是现场；设置是收尾。
2 观众距离：10cm 单手 → 正文 14px、机器文本 13px、元信息与页脚 12px；每屏 ≥3 处真实差异化信息
   （耗时/行数、上下文占比与 token、累计费用、思考等级、队列、待决策审批）。
3 视觉温度：冷静 · 精密，带仪器感。不兴奋（不做动效与庆祝），不温柔（不软化失败与危险）。
4 容量估算：三个 5 秒 thumbnail——(a) 顶部：用户消息 + 思考 + markdown 正文；(b) 中段：read / grep /
   edit / diff 四张工具卡连成一条纸带；(c) 底部：运行中的命令 + 失败卡 + 待决策 + 输入区。
   结论：一屏放 6 至 8 个块可行，前提是把卡片内的二级信息折叠成页脚一行（页脚 = 真实的「成功 · 132ms · 13 行」）。
5 视觉母题：执行脊（见上）。

【显式判断一：内容以事实底稿为唯一权威】
不设 todo / 待办 / plan / 子代理块，也不画复选方框——这个 App 没有这些生产者。
「清单」语义用助手正文里真实的 markdown 列表承担。进行中态只用真实措辞（如「运行中 · 已运行 12.3 秒 · 18 行」），
不写「没有响应」（源码里没有这个词）。edit 卡与 diff 卡是两张独立的卡，不合并。

【显式判断二：路径只出现在机器内容区】
App 自己的文案零路径、零类名、零内部术语（这是模板语的硬规范，已逐条执行）。
而工具卡的标题、命令、diff、输出本身就是 pi 的输出，路径是它的一部分，抹掉等于造假。
界线：机器内容区如实呈现 pi 的输出，卡片标题里的长路径只保留末几段以维持可读性（省略号是排版决定）。

【导航（按本次裁决）】底部三个目的地：对话 / 工作区 / 设置。
会话列表不再是 tab，而是从对话页左上角会话名进入的覆盖层（列表 ↔ 会话树 同层切换，新建会话也在这里）。
工作区 = 这个会话的项目现场（cwd、该目录的 pi 资源、改动、会话痕迹），不再是整屏终端；
终端降格为设置首页里的一个入口行（与 设备 / 扩展 / 关于 同级）。两栏只在 ≥600dp 宽屏出现，竖屏 412 不做两栏。

【真实内容】所有文案、块类型、状态词、页脚格式、按钮词、行标题与数值形状都取自事实底稿；
对话正文与 diff 正文是底稿里的样例内容，未新编。
-->

<style>
  /* ═══ pi 主题令牌（唯一调色板；不换色、不发明新色相） ═══ */
  :root{
    --accent:#8ABEB7; --border:#5F87FF; --border-accent:#00D7FF; --border-muted:#505050;
    --success:#B5BD68; --error:#CC6666; --warning:#FFFF00;
    --text:#D4D4D4; --muted:#808080; --dim:#666666;
    --selected-bg:#3A3A4A; --user-bg:#343541; --user-text:#D4D4D4;
    --custom-bg:#2D2838; --custom-label:#9575CD; --custom-text:#D4D4D4;
    --tool-pending:#282832; --tool-success:#283228; --tool-error:#3C2828;
    --tool-title:#D4D4D4; --tool-output:#808080;
    --md-heading:#F0C674; --md-link:#81A2BE; --md-link-url:#666666;
    --md-code:#8ABEB7; --md-codeblock:#B5BD68; --md-codeblock-border:#808080;
    --md-quote:#808080; --md-hr:#808080; --md-bullet:#8ABEB7;
    --diff-add:#B5BD68; --diff-del:#CC6666; --diff-ctx:#808080;
    --syn-comment:#6A9955; --syn-keyword:#569CD6; --syn-function:#DCDCAA; --syn-variable:#9CDCFE;
    --syn-string:#CE9178; --syn-number:#B5CEA8; --syn-type:#4EC9B0; --syn-op:#D4D4D4;
    --think-off:#505050; --think-minimal:#6E6E6E; --think-low:#5F87AF; --think-medium:#81A2BE;
    --think-high:#B294BB; --think-xhigh:#D183E8; --think-max:#FF5FFF;
    --bash:#B5BD68;
    --page:#18181E; --card:#1E1E24; --info:#3C3728;
    --surf-low:#1E1E24; --surf:#232329; --surf-high:#29292F; --surf-highest:#303036; --surf-dim:#1C1C22;
    /* pi 的对比度提升档：由 pi 色计算得出（同 piContrast 的机制），不是新颜色 */
    --body-on-tool:#9A9A9A;
    /* App 侧 alpha：颜色是 pi 的，透明度是 App 的 */
    --hairline:rgba(80,80,80,.55);
    --hairline-soft:rgba(80,80,80,.32);
    --code-line:rgba(128,128,128,.55);
    --diff-add-bg:rgba(181,189,104,.08);
    --diff-del-bg:rgba(204,102,102,.08);
    --scrim:rgba(0,0,0,.58);
    --mono:"Geist Mono","JetBrains Mono","Noto Sans Mono CJK SC","DejaVu Sans Mono",ui-monospace,monospace;
    --sans:"Geist","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0e0e12}
  body{font-family:var(--sans);color:var(--text);font-synthesis:none;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
  button:disabled{cursor:default}
  .num{font-variant-numeric:tabular-nums}

  /* ═══ 版面（设备框之外的部分） ═══ */
  .board{padding:48px}
  .hd{margin:0 0 34px;max-width:1180px}
  .hd-t{font-size:15px;line-height:22px;font-weight:700;color:var(--text)}
  .hd-s{font-size:13px;line-height:20px;color:var(--muted);margin-top:5px;text-wrap:pretty}
  .row{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .cell{display:flex;flex-direction:column;gap:9px}
  .cap{font-size:13px;line-height:18px;color:var(--text)}
  .cap em{font-style:normal;color:var(--muted)}
  .cap em:before{content:"｜";color:var(--dim)}
  .ctrls{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:3px}
  .ctrl{font-size:12px;line-height:16px;color:var(--muted);padding:4px 8px;border:1px solid transparent;border-radius:4px}
  .ctrl:hover{color:var(--text);border-color:var(--hairline)}
  .ctrl.is-on{color:var(--text);border-color:var(--border-muted)}
  .ctrl-k{font-size:12px;color:var(--dim);margin-right:2px}

  /* ═══ 设备内的页面骨架 ═══ */
  .app{height:100%;display:flex;flex-direction:column;background:var(--page);font-family:var(--sans);font-size:14px;line-height:22px;color:var(--text);font-synthesis:none;line-break:strict;overflow-wrap:anywhere;text-wrap:pretty}
  .stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
  .screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--page)}
  .scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
  .scroll::-webkit-scrollbar{width:0;height:0}

  /* 顶栏：小标签在上、名字在下（Panic 的读数式登记） */
  .appbar{display:flex;align-items:flex-start;gap:12px;padding:11px 16px 10px;border-bottom:1px solid var(--hairline)}
  .ab-l{min-width:0;flex:1}
  .ab-k{font-size:12px;line-height:15px;color:var(--muted)}
  .ab-t{font-size:17px;line-height:22px;font-weight:700;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ab-btn{display:block;width:100%;text-align:left}
  .ab-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .ab-s{font-family:var(--mono);font-size:12px;line-height:15px;color:var(--muted)}
  .ab-acts{display:flex;gap:2px}
  .act{font-size:12px;line-height:16px;color:var(--muted);padding:1px 5px;border-radius:4px}
  .act:hover{color:var(--text);background:var(--surf-high)}

  /* 状态条：一行读数 + 一条 1px 量尺 */
  .stats{display:flex;align-items:center;gap:12px;padding:7px 16px 0;font-family:var(--mono);font-size:12px;line-height:15px;color:var(--muted)}
  .stats b{font-weight:400;color:var(--text)}
  .meter{height:2px;background:var(--hairline-soft);margin:7px 16px 0}
  .meter i{display:block;height:2px;background:var(--accent)}
  .stats-src{font-size:12px;line-height:15px;color:var(--dim);padding:5px 16px 0;font-family:var(--mono)}

  .searchbar{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--hairline)}
  .searchbar input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-family:var(--mono);font-size:13px;line-height:18px;padding:3px 0}
  .searchbar input::placeholder{color:var(--dim)}

  /* ═══ 底部导航（三项，文字即导航） ═══ */
  .tabbar{flex:none;height:58px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--hairline);background:var(--page)}
  .tab{position:relative;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:18px;color:var(--muted)}
  .tab:hover{color:var(--text)}
  .tab.is-on{color:var(--text)}
  .tab.is-on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:11px;width:22px;height:2px;background:var(--accent)}

  /* ═══ 执行脊：转录 = 一条纸带 ═══ */
  .tape{padding:9px 0 12px}
  .blk{display:grid;grid-template-columns:44px minmax(0,1fr);padding-right:14px;margin:0 0 10px}
  .rail{position:relative;min-height:20px}
  .line{position:absolute;left:12px;top:-10px;bottom:-10px;border-left:1px solid var(--hairline)}
  .line.dotted{border-left-style:dashed}
  .node{position:absolute;left:5px;top:12px;width:14px;height:14px;border-radius:50%;border:1px solid var(--dim);background:var(--page);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;line-height:1}
  .node-sq{position:absolute;left:8px;top:15px;width:8px;height:8px;background:var(--accent)}
  .node-stripe{position:absolute;left:10px;top:13px;width:4px;height:12px}
  .node-dot{position:absolute;left:10px;top:16px;width:5px;height:5px;background:var(--muted)}
  .node-txt{position:absolute;left:4px;top:11px;width:16px;height:14px;text-align:center;font-family:var(--mono);font-size:13px;line-height:14px;background:var(--page)}
  .tick{position:absolute;left:20px;top:18px;display:flex;gap:2px;height:2px}
  .tick i{height:2px;background:currentColor;display:block}
  .ticklines{position:absolute;left:20px;top:15px;display:flex;flex-direction:column;gap:2px}
  .ticklines i{height:2px;display:block}
  .blk-b{padding:9px 0;min-width:0}
  .blk-b--flush{padding:0}

  /* 日期分隔：纸带在这里断一次 */
  .sep{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--muted)}
  .sep i{flex:1;height:1px;background:var(--hairline);display:block}
  .loadmore{font-size:12px;line-height:16px;color:var(--muted);font-family:var(--mono)}
  .loadmore:hover{color:var(--text)}

  /* 用户消息 */
  .bubble{background:var(--user-bg);border-radius:12px;padding:11px 13px}
  .bubble p{margin:0;font-size:14px;line-height:22px;color:var(--user-text)}
  .bubble .meta{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:7px}
  .bubble .time{font-size:12px;line-height:16px;color:var(--user-text);opacity:.62;font-variant-numeric:tabular-nums}
  .thumb{width:54px;height:72px;border:1px solid var(--hairline);border-radius:6px;display:flex;align-items:flex-end;padding:5px;background:var(--surf-low);margin-top:9px}
  .thumb span{font-family:var(--mono);font-size:12px;line-height:14px;color:var(--muted)}

  /* markdown */
  .md-h{font-size:20px;line-height:28px;font-weight:700;color:var(--md-heading);margin:0 0 8px}
  .md-p{margin:0 0 9px;font-size:14px;line-height:22px;color:var(--text)}
  .md-ul{margin:0 0 9px;padding:0;list-style:none}
  .md-ul li{position:relative;padding-left:15px;font-size:14px;line-height:22px;margin-bottom:3px}
  .md-ul li:before{content:"•";position:absolute;left:1px;color:var(--md-bullet)}
  .md-ol{margin:0 0 9px;padding:0;list-style:none}
  .md-ol li{position:relative;padding-left:19px;font-size:14px;line-height:22px;margin-bottom:3px}
  .md-ol li b{position:absolute;left:0;font-weight:400;color:var(--md-bullet);font-variant-numeric:tabular-nums}
  .icode{font-family:var(--mono);font-size:13px;color:var(--md-code);background:var(--info);border-radius:4px;padding:1px 4px}
  .code{background:var(--card);border:1px solid var(--code-line);border-radius:10px;padding:9px 11px;margin:0 0 9px;overflow:hidden}
  .code code{display:block;font-family:var(--mono);font-size:13px;line-height:19px;color:var(--md-codeblock)}
  .cl{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
  .k{color:var(--syn-keyword)} .f{color:var(--syn-function)} .v{color:var(--syn-variable)}
  .s{color:var(--syn-string)} .n{color:var(--syn-number)} .t{color:var(--syn-type)}
  .c{color:var(--syn-comment)} .o{color:var(--syn-op)}
  .caret{display:inline-block;width:8px;height:15px;border-radius:2px;background:var(--accent);opacity:.65;vertical-align:-2px}

  /* 工具卡 */
  .card{border-radius:10px;padding:10px 12px;background:var(--tool-pending)}
  .card.ok{background:var(--tool-success)}
  .card.err{background:var(--tool-error)}
  .tb-h{display:flex;align-items:baseline;gap:7px;width:100%}
  .tname{flex:none;font-family:var(--mono);font-size:12px;line-height:18px;color:var(--body-on-tool)}
  .tsubj{min-width:0;font-family:var(--mono);font-size:13px;line-height:18px;color:var(--tool-title)}
  .tstat{flex:none;margin-left:auto;font-family:var(--mono);font-size:12px;line-height:18px;font-variant-numeric:tabular-nums}
  .tstat.ok{color:var(--success)} .tstat.err{color:var(--error)} .tstat.pend{color:var(--warning)}
  .tb-b{margin-top:8px}
  .tb-f{margin-top:8px;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--body-on-tool);font-variant-numeric:tabular-nums}
  .mono-b{font-family:var(--mono);font-size:13px;line-height:19px;color:var(--tool-title)}
  .mono-b .ln{color:var(--body-on-tool);user-select:none}
  .prev-more{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--body-on-tool);margin-top:6px}
  .gfile{margin-top:7px}
  .gfile-h{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--tool-title)}
  .gfile-h em{font-style:normal;margin-left:auto;color:var(--body-on-tool)}
  .ghit{display:grid;grid-template-columns:34px minmax(0,1fr);font-family:var(--mono);font-size:13px;line-height:19px}
  .ghit span:first-child{color:var(--body-on-tool);text-align:right;padding-right:8px}
  .ghit span:last-child{white-space:pre-wrap;overflow-wrap:anywhere}
  .drow{display:grid;grid-template-columns:16px 30px minmax(0,1fr)}
  .dsym{font-family:var(--mono);font-size:13px;line-height:19px;color:var(--body-on-tool)}
  .dln{font-family:var(--mono);font-size:12px;line-height:19px;color:var(--body-on-tool);text-align:right;padding-right:8px;font-variant-numeric:tabular-nums}
  .dtx{font-family:var(--mono);font-size:13px;line-height:19px;color:var(--body-on-tool);white-space:pre-wrap;overflow-wrap:anywhere}
  .drow.add{background:var(--diff-add-bg)} .drow.add .dsym{color:var(--diff-add)} .drow.add .dtx{color:var(--tool-title)}
  .drow.del{background:var(--diff-del-bg)} .drow.del .dsym{color:var(--diff-del)} .drow.del .dtx{color:var(--tool-title)}
  .dfold{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--body-on-tool);background:var(--surf-dim);border-radius:4px;padding:2px 7px;display:inline-block;margin:5px 0}
  .dfile{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--body-on-tool);white-space:pre-wrap;overflow-wrap:anywhere}
  .dbars{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;line-height:16px}
  .dbars .add{color:var(--diff-add)} .dbars .del{color:var(--diff-del)}
  .dbars .sum{color:var(--body-on-tool);margin-left:2px}
  .cursor-line{display:inline-block;width:7px;height:14px;background:var(--accent);border-radius:1px;vertical-align:-2px}

  /* 思考块 */
  .think{display:flex;align-items:center;gap:8px;width:100%}
  .think-t{font-size:13px;line-height:20px;color:var(--text)}
  .think-lv{font-size:12px;line-height:16px;font-family:var(--mono)}
  .think-b{margin-top:7px;font-size:13px;line-height:21px;font-style:italic;color:var(--muted);border-left:1px solid var(--hairline);padding-left:10px}
  .fold{margin-left:auto;flex:none;font-size:12px;line-height:16px;color:var(--body-on-tool)}

  /* 自定义卡（扩展 / 分支摘要 / 技能） */
  .ccard{background:var(--custom-bg);border:1px solid rgba(149,117,205,.35);border-radius:10px;padding:10px 12px}
  .ccard-h{display:flex;align-items:baseline;gap:8px;width:100%}
  .ccard-k{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--custom-label)}
  .ccard-t{font-size:13px;line-height:18px;color:var(--custom-text)}
  .ccard-b{margin-top:7px;font-size:13px;line-height:20px;color:var(--custom-text)}
  .ccard-b ul{margin:0;padding:0;list-style:none}
  .ccard-b li{position:relative;padding-left:14px;margin-bottom:2px}
  .ccard-b li:before{content:"·";position:absolute;left:2px;color:var(--custom-label)}
  .hook{margin-top:7px;font-size:13px;line-height:20px;color:var(--custom-text)}

  /* 通知 / 压缩 / 模型切换 */
  .notice{display:flex;gap:8px;font-size:12px;line-height:17px;font-family:var(--mono);color:var(--muted)}
  .notice b{font-weight:400;color:var(--text)}
  .notice .time{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
  .comp{display:flex;align-items:center;gap:10px}
  .comp i{flex:1;height:1px;background:var(--hairline);display:block}
  .comp-chip{background:var(--custom-bg);color:var(--custom-label);border-radius:999px;padding:3px 10px;font-size:12px;line-height:16px;white-space:nowrap}
  .comp-cap{font-size:12px;line-height:16px;color:var(--muted);margin-top:6px;text-align:center}
  .mchange{display:flex;align-items:center;gap:8px;font-size:12px;line-height:17px;color:var(--muted)}
  .mchange b{font-weight:400;font-family:var(--mono);font-size:13px;color:var(--border-accent)}
  .err-more{margin-top:7px;font-size:12px;line-height:16px;color:var(--error);font-family:var(--mono)}
  .err-detail{margin-top:7px;font-family:var(--mono);font-size:12px;line-height:18px;color:var(--body-on-tool);background:var(--surf-dim);border-radius:6px;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere}

  /* 输入区与待决策 */
  .dock{flex:none;border-top:1px solid var(--hairline);background:var(--page)}
  .approve{display:block;width:100%;padding:10px 16px;border-bottom:1px solid var(--hairline);background:var(--surf-dim)}
  .approve-h{display:flex;align-items:baseline;gap:8px}
  .approve-t{font-size:13px;line-height:19px;color:var(--text)}
  .approve-q{margin-left:auto;flex:none;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted)}
  .approve-a{display:flex;align-items:center;gap:8px;margin-top:8px}
  .approve-note{font-size:12px;line-height:16px;color:var(--muted);min-width:0}
  .btn{font-size:13px;line-height:18px;padding:6px 14px;border-radius:8px;border:1px solid var(--hairline);color:var(--text)}
  .btn:hover{border-color:var(--muted)}
  .btn--pri{background:var(--accent);border-color:var(--accent);color:var(--page);font-weight:700}
  .btn--pri:hover{background:var(--accent);border-color:var(--accent)}
  .btn--danger{border-color:var(--error);color:var(--error)}
  .btn--ghost{color:var(--muted)}
  .btn:disabled{color:var(--dim);border-color:var(--hairline-soft)}
  .queue{display:flex;align-items:center;gap:6px;padding:7px 16px 0}
  .qchip{font-size:12px;line-height:16px;color:var(--text);background:var(--surf-high);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
  .queue .act{margin-left:auto}
  .composer{padding:7px 16px 0}
  .composer-box{border:1px solid var(--think-medium);border-radius:10px;padding:9px 11px;min-height:40px}
  .composer-box.bash{border-color:var(--bash)}
  .composer-box textarea{display:block;width:100%;min-height:20px;max-height:76px;background:none;border:0;outline:none;resize:none;color:var(--text);font-family:var(--sans);font-size:14px;line-height:20px;padding:0}
  .composer-box textarea::placeholder{color:var(--dim)}
  .keys{display:flex;align-items:center;gap:5px;padding:8px 16px 10px;flex-wrap:wrap}
  .key{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);border:1px solid var(--hairline);border-radius:5px;padding:2px 7px}
  .key:hover{color:var(--text);border-color:var(--muted)}
  .key--lv{border-color:var(--think-medium);color:var(--think-medium)}
  .send{margin-left:auto;font-size:13px;line-height:18px;color:var(--page);background:var(--accent);border-radius:8px;padding:5px 14px;font-weight:700}
  .send--stop{background:var(--error)}

  /* ═══ 会话列表 / 会话树 覆盖层 ═══ */
  .overlay{position:absolute;inset:0;z-index:60;background:var(--page);display:flex;flex-direction:column}
  .modal{position:absolute;inset:0;z-index:80;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:22px}
  .modal--sheet{align-items:flex-end;padding:0}
  .dialog{width:100%;max-width:330px;background:var(--surf-low);border:1px solid var(--hairline);border-radius:16px;padding:16px}
  .dialog-t{font-size:15px;line-height:21px;font-weight:700}
  .dialog-b{font-size:14px;line-height:21px;color:var(--text);margin-top:9px}
  .dialog-n{font-size:12px;line-height:17px;color:var(--muted);margin-top:9px}
  .dialog-a{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
  .dialog-a .btn{white-space:nowrap}
  .sheet{width:100%;max-height:74%;background:var(--surf-low);border-radius:18px 18px 0 0;border-top:1px solid var(--hairline);display:flex;flex-direction:column}
  .sheet-t{font-size:15px;line-height:21px;font-weight:700;padding:15px 16px 0}
  .sheet-s{font-size:12px;line-height:17px;color:var(--muted);padding:5px 16px 0}
  .sheet-c{overflow-y:auto;padding:9px 0 4px;scrollbar-width:none}
  .sheet-c::-webkit-scrollbar{width:0}
  .opt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;font-size:14px;line-height:20px;color:var(--text)}
  .opt:hover{background:var(--surf)}
  .opt.is-on{background:var(--selected-bg)}
  .opt em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .sheet-f{padding:10px 16px 14px;border-top:1px solid var(--hairline)}

  .obar{display:flex;align-items:flex-start;gap:10px;padding:11px 16px 9px;border-bottom:1px solid var(--hairline)}
  .obar-k{font-size:12px;line-height:15px;color:var(--muted)}
  .obar-t{font-size:17px;line-height:22px;font-weight:700;margin-top:1px}
  .obar-r{flex:none;display:flex;align-items:center;gap:2px;padding-top:2px}
  .seg{display:flex;gap:2px}
  .seg-b{font-size:12px;line-height:16px;color:var(--muted);padding:4px 10px;border-radius:6px}
  .seg-b:hover{color:var(--text)}
  .seg-b.is-on{color:var(--text);background:var(--surf-high)}
  .sqrow{display:flex;align-items:center;gap:8px;padding:8px 16px 8px;font-size:12px;line-height:16px;color:var(--muted);border-bottom:1px solid var(--hairline-soft)}
  .sqrow .act{margin-left:auto}
  .sqrow input{background:none;border:0;outline:none;flex:1;min-width:0;color:var(--text);font-family:var(--mono);font-size:13px;padding:1px 0}
  .sqrow input::placeholder{color:var(--dim)}

  .ghead{display:flex;align-items:center;gap:9px;padding:13px 16px 6px;font-size:12px;line-height:16px;color:var(--accent)}
  .ghead i{flex:1;height:1px;background:var(--hairline);display:block}
  .srow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:11px 16px;border-bottom:1px solid var(--hairline-soft);width:100%}
  .srow:hover{background:var(--surf)}
  .srow.is-sel{background:var(--selected-bg)}
  .srow-1{display:flex;align-items:baseline;gap:7px;min-width:0}
  .sname{font-size:14px;line-height:20px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{flex:none;font-size:12px;line-height:15px;border:1px solid var(--border-muted);border-radius:4px;padding:1px 5px;color:var(--muted)}
  .badge--cur{border-color:var(--accent);color:var(--accent)}
  .badge--new{border-color:var(--dim);color:var(--muted)}
  .badge--reload{border-color:var(--custom-label);color:var(--custom-label)}
  .badge--restart{border-color:var(--error);color:var(--error)}
  .srow-2{grid-column:1;font-family:var(--mono);font-size:12px;line-height:17px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .srow-3{grid-column:1;font-family:var(--mono);font-size:12px;line-height:17px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
  .srow-r{grid-row:1/span 3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .stime{font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

  .fab{position:absolute;right:16px;bottom:16px;z-index:20;background:var(--surf-high);border:1px solid var(--hairline);color:var(--text);border-radius:10px;padding:9px 14px;font-size:13px;line-height:18px}
  .fab:hover{border-color:var(--muted)}
  .empty{padding:44px 28px;text-align:center}
  .empty .mk{display:flex;justify-content:center;margin-bottom:14px;opacity:.9}
  .empty-t{font-size:15px;line-height:22px;font-weight:700}
  .empty-b{font-size:13px;line-height:20px;color:var(--muted);margin-top:7px;text-wrap:pretty}

  /* 会话树 */
  .trow{display:flex;align-items:flex-start;gap:8px;padding:8px 16px;border-bottom:1px solid var(--hairline-soft)}
  .trow-rail{flex:none;width:2px;background:var(--hairline);align-self:stretch;margin-top:2px}
  .trow-t{font-size:13px;line-height:19px;color:var(--text);min-width:0}
  .trow-k{font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);margin-top:3px}
  .trow .act{margin-left:auto;flex:none}

  /* ═══ 工作区 ═══ */
  .wsec{padding:15px 16px 4px}
  .wsec-h{display:flex;align-items:baseline;gap:9px;font-size:12px;line-height:16px;color:var(--muted)}
  .wsec-h i{flex:1;height:1px;background:var(--hairline);display:block}
  .wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:10px 16px;border-bottom:1px solid var(--hairline-soft);width:100%}
  .wrow:hover{background:var(--surf)}
  .wrow.is-open{background:var(--surf-dim)}
  .wrow-t{font-size:14px;line-height:20px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow-d{font-family:var(--mono);font-size:12px;line-height:17px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .wrow-v{font-family:var(--mono);font-size:12px;line-height:18px;color:var(--text);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
  .wrow-v.mut{color:var(--muted)}
  .wrow-v.add{color:var(--diff-add)} .wrow-v.del{color:var(--diff-del)}
  .wsub{border-bottom:1px solid var(--hairline-soft);padding:8px 16px 9px;background:var(--surf-dim)}
  .wsub-r{display:flex;align-items:baseline;gap:9px;font-family:var(--mono);font-size:12px;line-height:18px;color:var(--muted);padding:2px 0}
  .wsub-r b{font-weight:400;color:var(--text)}
  .wsub-r em{font-style:normal;margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
  .wfoot{padding:12px 16px 18px;font-size:12px;line-height:18px;color:var(--muted);text-wrap:pretty}
  .wproj{padding:13px 16px 12px;border-bottom:1px solid var(--hairline)}
  .wproj-t{font-size:15px;line-height:21px;font-weight:700}
  .wproj-d{font-family:var(--mono);font-size:12px;line-height:17px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wproj-k{display:flex;gap:14px;margin-top:9px;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--muted);flex-wrap:wrap}
  .wproj-k b{font-weight:400;color:var(--text)}
  .wrun{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--hairline);background:var(--tool-pending)}
  .wrun-t{font-family:var(--mono);font-size:13px;line-height:18px;color:var(--tool-title);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrun-s{margin-left:auto;flex:none;font-family:var(--mono);font-size:12px;line-height:16px;color:var(--warning);white-space:nowrap}

  /* ═══ 设置 ═══ */
  .ssearch{display:flex;align-items:center;gap:9px;margin:12px 16px 4px;border:1px solid var(--hairline);border-radius:8px;padding:9px 11px}
  .ssearch input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:14px;line-height:20px}
  .ssearch input::placeholder{color:var(--dim)}
  .ssearch em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
  .mcard{margin:12px 16px 2px;border:1px solid var(--hairline);border-radius:10px;padding:12px 13px}
  .mcard-k{font-size:12px;line-height:16px;color:var(--muted)}
  .mcard-v{font-family:var(--mono);font-size:14px;line-height:20px;margin-top:4px}
  .mcard-d{font-family:var(--mono);font-size:12px;line-height:17px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
  .setrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border-bottom:1px solid var(--hairline-soft);cursor:pointer}
  .setrow:hover{background:var(--surf)}
  .setrow.is-sel{background:var(--selected-bg)}
  .setrow-l{min-width:0;flex:1}
  .setrow-t{display:flex;align-items:baseline;gap:7px;font-size:14px;line-height:20px}
  .setrow-t.act-primary{color:var(--accent)}
  .setrow-t.act-danger{color:var(--error)}
  .setrow-d{font-size:12px;line-height:17px;color:var(--muted);margin-top:3px;text-wrap:pretty}
  .setrow-v{flex:none;font-family:var(--mono);font-size:13px;line-height:18px;color:var(--muted);max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
  .setrow-v.set{color:var(--text)}
  .chev{flex:none;font-family:var(--mono);font-size:13px;color:var(--dim);padding-left:2px}
  .sw{flex:none;width:38px;height:22px;border-radius:999px;background:var(--surf-highest);position:relative;transition:background-color .12s}
  .sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:left .12s,background-color .12s}
  .sw.is-on{background:var(--accent)}
  .sw.is-on i{left:19px;background:var(--page)}
  .sect{padding:16px 16px 5px;font-size:12px;line-height:16px;color:var(--muted)}
  .sect i{display:block;height:1px;background:var(--hairline);margin-top:7px}
  .sfoot{padding:14px 16px 20px;font-size:12px;line-height:18px;color:var(--muted);text-wrap:pretty}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="react">
/* ════════════════════════════════════════════════════════════════
   第一段：设备框（原样内联，未做任何改动）+ 共享基元
   ════════════════════════════════════════════════════════════════ */

  navBar: {

};

function AndroidFrame({
  children,
  width = 412,
  height = 892,
  time = '9:41',

  return (

            </svg>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none">

/* ── π 字形（唯一品牌图形，一个 path，原样使用） ── */

      <path fill="var(--accent)" d="M30,38 H78 V46 H71 V74 H63 V46 H45 V74 H37 V46 H30 Z" />
    </svg>
  );
}

/* ── 长路径的可读化：只保留末三段（排版决定，内容不变） ── */
function shortPath(p) {
  const parts = String(p).split('/');
  if (parts.length <= 3) return p;
  return '…/' + parts.slice(parts.length - 3).join('/');
}

/* ── 执行脊：刻度 = 该步真实耗时（对数 + 按量级分段） ── */
function tickSpec(ms) {
  const lo = Math.log10(50), hi = Math.log10(20000);
  const t = Math.max(0, Math.min(1, (Math.log10(Math.max(ms, 50)) - lo) / (hi - lo)));
  const w = Math.round(5 + t * 17);
  const seg = ms < 1000 ? 1 : (ms < 10000 ? 2 : 3);
  return { w: w, seg: seg };
}

function RailTick({ ms, status }) {
  const s = tickSpec(ms);
  const color = status === 'pending' ? 'var(--accent)' : (status === 'error' ? 'var(--error)' : 'var(--dim)');
  const segW = Math.max(3, Math.round((s.w - (s.seg - 1) * 2) / s.seg));
  const segs = [];
  for (let i = 0; i < s.seg; i++) segs.push(<i key={i} style={{ width: segW + 'px' }} />);
  return <span className="tick" style={{ color: color }}>{segs}</span>;
}

/* diff 的双条刻度：长度 = 真实增删行数 */
function RailLines({ add, del }) {
  return (
    <span className="ticklines">
      <i style={{ width: Math.min(22, 4 + add * 2) + 'px', background: 'var(--diff-add)' }} />
      <i style={{ width: Math.min(22, 4 + del * 2) + 'px', background: 'var(--diff-del)' }} />
    </span>
  );
}

/* ── 块：挂在脊上的一个节点 ── */
function Blk({ kind, status, ms, nodeKind, tickLines, color, children }) {
  const dotted = kind === 'prose' || kind === 'think' || kind === 'notice';
  const breakTape = kind === 'sep' || kind === 'compaction';
  const stColor = status === 'pending' ? 'var(--warning)' : (status === 'error' ? 'var(--error)' : 'var(--success)');
  let node = null;
  if (nodeKind === 'tool') {
    node = <span className="node" style={{ borderColor: stColor, color: stColor }}>{status === 'pending' ? '…' : (status === 'error' ? '✗' : '✓')}</span>;
  } else if (nodeKind === 'think') {
    node = <span className="node-stripe" style={{ background: color || 'var(--think-medium)' }} />;
  } else if (nodeKind === 'user') {
    node = <span className="node-sq" />;
  } else if (nodeKind === 'notice') {
    node = <span className="node-dot" />;
  } else if (nodeKind === 'arrow') {
    node = <span className="node-txt" style={{ color: 'var(--border-accent)' }}>→</span>;
  } else if (nodeKind === 'diff') {
    node = <span className="node-txt" style={{ color: 'var(--muted)' }}>±</span>;
  }
  return (
    <div className={'blk k-' + kind}>
      <div className="rail" aria-hidden="true">
        {!breakTape && <span className={'line' + (dotted ? ' dotted' : '')} />}
        {node}
        {ms != null && <RailTick ms={ms} status={status} />}
        {tickLines && <RailLines add={tickLines.add} del={tickLines.del} />}
      </div>
      <div className="blk-b">{children}</div>
    </div>
  );
}

/* ── 分段控件 ── */
function Seg({ items, value, onChange }) {

/* ── 开关 ── */
function Switch({ on, onChange }) {

/* ── 对话框与底部 sheet ── */
function Dialog({ title, body, note, actions, onClose }) {

function Sheet({ title, sub, children, actions, onClose }) {

      </div>
    </div>

}

function SessionsOverlay({ initialView, initialEmpty, initialQ, onClose }) {
  const [view, setView] = useState2(initialView || '列表');

  const [q, setQ] = useState2(initialQ || '');

  const [namedOnly, setNamedOnly] = useState2(false);
  const [sel, setSel] = useState2(null);
  const [dlg, setDlg] = useState2(null);
  const [treeQ, setTreeQ] = useState2('');
  const [treeTab, setTreeTab] = useState2('分支');

  let groups = GROUPS.map(function (grp) {
    return {
      g: grp.g,
      rows: grp.rows.filter(function (r) {
        if (namedOnly && !r.named) return false;
        if (!q) return true;
        const hay = (r.t + ' ' + grp.g + ' ' + (r.model || '')).toLowerCase();
        return hay.indexOf(q.toLowerCase()) >= 0;
      }),
    };
  }).filter(function (grp) { return grp.rows.length > 0; });
  if (byName) {
    groups = groups.slice().sort(function (a, b) { return a.g.localeCompare(b.g); });
    groups = groups.map(function (grp) {
      return { g: grp.g, rows: grp.rows.slice().sort(function (a, b) { return a.t.localeCompare(b.t); }) };
    });
  }
  const noMatch = groups.length === 0;
  const showEmpty = emptyMode === '还没有会话';

  const selRow = (function () {
    for (let i = 0; i < GROUPS.length; i++) {
      for (let j = 0; j < GROUPS[i].rows.length; j++) {
        if (GROUPS[i].rows[j].t === sel) return GROUPS[i].rows[j];
      }
    }
    return null;
  })();

  return (
    <div className="overlay">

            <span className="act" style={{ marginLeft: 'auto', color: 'var(--dim)' }}>长按一行可删除该会话</span>

function SettingsGroupScreen({ group, onBack }) {
  const defs = GROUP_DEFS[group] || GROUP_DEFS['模型与推理'];
  const [sw, setSw] = useState2({});
  const [sheet, setSheet] = useState2(null);
  const [dlg, setDlg] = useState2(null);
  const [sel, setSel] = useState2(null);

  function switchOn(r) {
    if (r.t in sw) return sw[r.t];
    return !!r.on;
  }
  function badgeText(b) { return b; }
  function openRow(r) {
    setSel(r.t);
    if (r.kind === 'switch') return;
    if (r.kind === 'action') { setDlg(r); return; }
    if (r.kind === 'value') { setSheet({ mode: 'opts', row: r }); return; }
    if (r.kind === 'list') { setSheet({ mode: 'list', row: r }); return; }
    if (r.kind === 'number') { setSheet({ mode: 'num', row: r }); return; }
    if (r.kind === 'text') { setSheet({ mode: r.readonly ? 'ro' : 'text', row: r }); return; }
  }

  return (
    <div className="screen">
      <div className="appbar">
        <div className="ab-l">
          <div className="ab-k"><button className="act" onClick={onBack}>返回</button></div>
          <div className="ab-t">{group}</div>
        </div>
        <div className="ab-r">
          <div className="ab-s">设置</div>
        </div>
      </div>

      <div className="scroll">
        {defs.map(function (r, i) {
          if (r.sect) return <div className="sect" key={'s' + i}>{r.sect}<i /></div>;
          const on = switchOn(r);
          const isSel = sel === r.t;
          return (
            <div key={r.t} className={'setrow' + (isSel ? ' is-sel' : '')} onClick={function () { openRow(r); }}>
              <span className="setrow-l">
                <span className={'setrow-t' + (r.danger ? ' act-danger' : (r.kind === 'action' ? ' act-primary' : ''))}>
                  <span>{r.t}</span>
                  {r.badge ? (
                    <span
                      className={'badge ' + (r.badge === '仅新会话' ? 'badge--new' : (r.badge === '新会话' ? 'badge--new' : (r.badge === '需重载' ? 'badge--reload' : 'badge--restart')))}
                      onClick={function (e) { e.stopPropagation(); setDlg({ t: r.t, badge: r.badge, kind: 'badge' }); }}
                    >{badgeText(r.badge)}</span>
                  ) : null}
                </span>
                {r.d ? <span className="setrow-d">{r.d}</span> : null}
              </span>
              {r.kind === 'switch' ? (
                <Switch on={on} onChange={function (next) { const n = Object.assign({}, sw); n[r.t] = next; setSw(n); }} />
              ) : r.kind === 'action' ? null : (
                <span style={{ display: 'flex', alignItems: 'center' }}>
                  <span className={'setrow-v' + (r.v && r.v !== '未设置' && r.v !== '—' ? ' set' : '')}>{r.v}</span>
                  <span className="chev">›</span>
                </span>
              )}
            </div>
          );
        })}

        <div className="sfoot">
          改完不一定马上生效：带徽标的行要按它的方式生效。徽标点一下能看到说明。
        </div>
      </div>

      {sheet && sheet.mode === 'opts' ? (
        <Sheet
          title={sheet.row.t}
          sub="选一个值。"
          onClose={function () { setSheet(null); }}
          actions={[{ label: '取消', onClick: function () { setSheet(null); } }]}
        >
          {sheet.row.opts.map(function (o) {
            const cur = o === sheet.row.v;
            return (
              <button key={o} className={'opt' + (cur ? ' is-on' : '')} onClick={function () { setSheet(null); }}>
                <span style={{ fontFamily: 'var(--mono)', fontSize: 13 }}>{o}</span>
                {cur ? <em>当前</em> : null}
              </button>
            );
          })}
        </Sheet>
      ) : null}

      {sheet && sheet.mode === 'list' ? (
        <Sheet
          title={sheet.row.t}
          sub="每行一项，支持 glob 与排除标记：!pattern 排除、+path 强制包含、-path 强制排除。"

        >
          <div className="opt" style={{ fontFamily: 'var(--mono)', fontSize: 13, color: 'var(--muted)' }}>{sheet.row.v}</div>
        </Sheet>
      ) : null}

      {sheet && sheet.mode === 'num' ? (
        <Sheet
          title={sheet.row.t}
          sub="按需微调，正负都行。"
          onClose={function () { setSheet(null); }}
          actions={[{ label: '取消', onClick: function () { setSheet(null); } }, { label: '确定', kind: 'pri', onClick: function () { setSheet(null); } }]}
        >
          <div className="opt" style={{ justifyContent: 'center', gap: 18 }}>
            <span className="btn btn--ghost">−1</span>
            <span style={{ fontFamily: 'var(--mono)', fontSize: 22 }}>{sheet.row.v}</span>
            <span className="btn btn--ghost">+1</span>
          </div>
        </Sheet>
      ) : null}

      {sheet && (sheet.mode === 'text' || sheet.mode === 'ro') ? (
        <Sheet
          title={sheet.row.t}
          sub={sheet.mode === 'ro' ? '这一行是只读的，来自运行中的引擎。' : '留空表示未设置。'}
          onClose={function () { setSheet(null); }}
          actions={sheet.mode === 'ro'
            ? [{ label: '知道了', kind: 'pri', onClick: function () { setSheet(null); } }]
            : [{ label: '取消', onClick: function () { setSheet(null); } }, { label: '确定', kind: 'pri', onClick: function () { setSheet(null); } }]}
        >
          <div className="opt" style={{ fontFamily: 'var(--mono)', fontSize: 13, color: 'var(--muted)' }}>{sheet.row.v}</div>
        </Sheet>
      ) : null}

      {dlg && dlg.kind === 'badge' ? (
        <Dialog
          title={dlg.badge === '需重载' ? '需要重载' : (dlg.badge === '需重启' ? '需要重启 App' : '需要重启引擎')}
          body={'「' + dlg.t + '」改完之后要' + (dlg.badge === '需重载' ? '重载一次' : (dlg.badge === '需重启' ? '重启 App' : '重启引擎')) + '才会生效。'}
          actions={[{ label: '稍后', onClick: function () { setDlg(null); } }, { label: dlg.badge === '需重载' ? '立即重载' : (dlg.badge === '需重启' ? '重启 App' : '重启引擎'), kind: 'pri', onClick: function () { setDlg(null); } }]}
          onClose={function () { setDlg(null); }}
        />
      ) : null}

      {dlg && dlg.kind !== 'badge' ? (
        dlg.t === '重启引擎' ? (
          <Dialog
            title="重启引擎"
            body="现在有回合正在运行。重启会终止模型调用、工具调用与正在跑的命令，它们都不会恢复；已写入磁盘的会话不会丢失。"
            actions={[{ label: '取消', onClick: function () { setDlg(null); } }, { label: '重启', kind: 'pri', onClick: function () { setDlg(null); } }]}
            onClose={function () { setDlg(null); }}
          />
        ) : dlg.danger ? (
          <Dialog
            title="紧急停止"
            body="会立刻终止模型调用、工具调用与正在跑的命令。已写入磁盘的会话不会丢失。"
            actions={[{ label: '取消', onClick: function () { setDlg(null); } }, { label: '确认执行', kind: 'danger', onClick: function () { setDlg(null); } }]}
            onClose={function () { setDlg(null); }}
          />
        ) : (
          <Dialog
            title={dlg.t}
            body={dlg.d || '这个入口会在 pi 运行时打开对应的页面。'}
            note="这个入口当前不可用。"
            actions={[{ label: '知道了', kind: 'pri', onClick: function () { setDlg(null); } }]}
            onClose={function () { setDlg(null); }}
          />
        )
      ) : null}
    </div>
  );
}

/* ═══════════ 目的地容器 ═══════════ */
function SettingsDest({ startGroup }) {
  const [group, setGroup] = useState2(startGroup || null);
  if (group) return <SettingsGroupScreen group={group} onBack={function () { setGroup(null); }} />;
  return <SettingsHome onOpenGroup={function (g) { if (GROUP_DEFS[g]) setGroup(g); }} />;
}

function PiApp({ startTab, overlay, sessionsView, sessionsEmpty, sessionsQ, settingsGroup, chatApproval, onChatDecide, chatView }) {
  const [tab, setTab] = useState2(startTab || 'chat');
  const [ov, setOv] = useState2(overlay || null);
  React.useEffect(function () { setOv(overlay || null); }, [overlay]);
  return (
    <div className="app">
      <div className="stage">
        {tab === 'chat' ? (
          <ChatScreen
            openSessions={function () { setOv('sessions'); }}
            showApproval={chatApproval}
            onDecide={onChatDecide}
            view={chatView}
          />
        ) : null}
        {tab === 'workbench' ? <WorkspaceScreen /> : null}
        {tab === 'settings' ? <SettingsDest startGroup={settingsGroup || null} /> : null}
        {ov === 'sessions' ? (
          <SessionsOverlay
            initialView={sessionsView || '列表'}
            initialEmpty={!!sessionsEmpty}
            initialQ={sessionsQ || ''}
            onClose={function () { setOv(null); }}
          />
        ) : null}
      </div>
      <TabBar active={tab} onSelect={function (t) { setTab(t); setOv(null); }} />
    </div>
  );
}

/* ═══════════ 五台设备 ═══════════ */
function Cell(props) {
  return (
    <div className="cell">
      <div className="cap">{props.title}{props.note ? <em>{props.note}</em> : null}</div>
      {props.controls ? <div className="ctrls">{props.controls}</div> : null}
      <AndroidFrame width={412} height={892} darkMode time="9:41" battery={82}>
        {props.children}
      </AndroidFrame>
    </div>
  );
}

function App() {
  const [c1, setC1] = useState2(true);
  const [cv, setCv] = useState2('tools');
  const [c2, setC2] = useState2(null);
  const [c2view, setC2view] = useState2('列表');
  const [c5, setC5] = useState2('模型与推理');

  return (
    <div className="board">
      <div className="hd">
        <div className="hd-t">方向 C · 作者性取向 ｜ 设计者视角：Panic Inc.（Cabel Sasser）</div>
        <div className="hd-s">
          母题 = 执行脊：转录左缘是一条连续的量尺，刻度长度与分段 = 该步真实耗时，diff 的双条 = 真实增删行数。
          全稿克制到 80%，只有「正在跑的那一步」发光。
        </div>
      </div>

      <div className="row">
        <Cell
          title="① 对话（hero，主战场）"
          note="默认落在工具带，好让竖脊刻度一眼可见；左上是会话名，点它开列表"
          controls={
            <React.Fragment>
              <span className="ctrl-k">视野</span>
              <button className={'ctrl' + (cv === 'top' ? ' is-on' : '')} onClick={function () { setCv('top'); }}>顶部</button>
              <button className={'ctrl' + (cv === 'tools' ? ' is-on' : '')} onClick={function () { setCv('tools'); }}>工具带</button>
              <button className={'ctrl' + (cv === 'bottom' ? ' is-on' : '')} onClick={function () { setCv('bottom'); }}>末尾</button>
              <span className="ctrl-k">待决策</span>
              <button className={'ctrl' + (c1 ? ' is-on' : '')} onClick={function () { setC1(true); }}>显示</button>
              <button className={'ctrl' + (!c1 ? ' is-on' : '')} onClick={function () { setC1(false); }}>隐藏</button>
            </React.Fragment>
          }
        >
          <PiApp
            key="a1"
            startTab="chat"
            chatView={cv}
            chatApproval={c1}
            onChatDecide={function () { setC1(false); }}
          />
        </Cell>

        <Cell
          title="② 会话列表（覆盖层，从对话页左上角进入）"
          note="列表 ↔ 会话树 同层切换；两种空态都在这里"
          controls={
            <React.Fragment>
              <span className="ctrl-k">覆盖层</span>
              <button className={'ctrl' + (c2view === '列表' && !c2 ? ' is-on' : '')} onClick={function () { setC2view('列表'); setC2(null); }}>列表</button>
              <button className={'ctrl' + (c2view === '会话树' ? ' is-on' : '')} onClick={function () { setC2view('会话树'); setC2(null); }}>会话树</button>
              <button className={'ctrl' + (c2 === 'empty' ? ' is-on' : '')} onClick={function () { setC2view('列表'); setC2('empty'); }}>还没有会话</button>
              <button className={'ctrl' + (c2 === 'nomatch' ? ' is-on' : '')} onClick={function () { setC2view('列表'); setC2('nomatch'); }}>没有匹配</button>
            </React.Fragment>
          }
        >
          <PiApp
            key={'b' + c2view + (c2 || '')}
            startTab="chat"
            overlay="sessions"
            sessionsView={c2view}
            sessionsEmpty={c2 === 'empty'}
            sessionsQ={c2 === 'nomatch' ? 'zzz' : ''}
          />
        </Cell>

        <Cell title="③ 工作区（项目现场）" note="本版工作区 = 这个会话的项目现场；终端住在设置里">
          <PiApp startTab="workbench" />
        </Cell>

        <Cell title="④ 设置首页" note="设备 / 扩展 / 终端 / 关于 四个入口 + 12 个分组，搜索能筛">
          <PiApp startTab="settings" />
        </Cell>

        <Cell
          title="⑤ 设置的一个分组页"
          note="六种行型 + 生效方式徽标 + 危险行确认态"
          controls={
            <React.Fragment>
              <span className="ctrl-k">分组</span>
              {['模型与推理', '外观', '安全与信任', '运行时与诊断'].map(function (g) {
                return <button key={g} className={'ctrl' + (c5 === g ? ' is-on' : '')} onClick={function () { setC5(g); }}>{g}</button>;
              })}
            </React.Fragment>
          }
        >
          <PiApp key={'c' + c5} startTab="settings" settingsGroup={c5} />
        </Cell>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
