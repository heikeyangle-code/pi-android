<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PI · 安卓客户端界面重构 · 方向 B（v2 完整版）</title>
<!--
================================================================================
方向 B · Full pass（v2）—— PI 安卓客户端界面重构
================================================================================
底座：design-demos/direction-b.html（用户已批准的那一版）。本文件不重新发明设计语言，
只在它的五条方法论文脉上把状态补齐，并按要求从 A / C 各移一点点优点过来。

【底座继承的五条（原样保留，未改写）】
1 倒 L 骨架：底栏三个目的地（对话 / 工作区 / 设置）+ 每屏顶部一个主操作；会话列表是对话页
  左上角进入的覆盖层，不是第四个 tab。
2 注意力预算：chrome（顶栏 / 底栏）落在 --surf-dim，内容区留在 --page。
3 结构不被看见：分组 = 表面阶梯 + inset hairline，不用卡片描边、不用阴影、不用圆角描边堆叠。
4 属性即内容：每行 = 标题 + 右对齐属性（模型名 / 条数 / 耗时 / 退出码 / 增删行），数字 tabular-nums。
5 直接操作：列表行可选中、可左滑露出动作、可点开就地展开；输入 / 立刻出命令候选。
（原版顶部的参照案例与五条迁移的完整出处，见 direction-b.html 顶部注释，v2 不重复。）

--------------------------------------------------------------------------------
【v2 从 A 移过来的（只有两条，其余 A 的东西一概不要）】
1 · 块脚耗时刻度（A 的「尺规语法」）→ 落到 B 的工具卡页脚右端。
   实现：`Tick({ms,color})`，1px 高横线，**总长 ∝ log₂(耗时毫秒)**，并按量级**分段**：
   <1s 一段、<10s 两段、≥10s 三段（段间 2px 缝），颜色取该块的状态色。
   目的正是 A 那句话说的：让 132ms 与 6.4 秒一眼可比。**B 原本的读数文字全部保留**
   （`成功 · 132ms · 13 行`），刻度是它的视觉补充，不是替代。
   每张工具卡 / 命令卡显式传 `ms`，与页脚文字里的数字同源，不允许刻度与文字打架。
2 · 状态行补两个读数（A 的 usage 字段）→ 落在对话页那一行状态行里。
   原：`上下文 52% [分段进度] 104k / 200k $0.42`
   现：`上下文 52% [8 段进度] 104k / 200k · 输出 8.2k · 缓存读 61.4k · $0.42`
   两个读数来自 pi 的真实 usage 字段（get_session_stats 的输入/输出/缓存读/缓存写），
   与「会话信息」sheet 里的 Token 行同源。**不做** A 的四格仪表盘、屏顶横读数带、等距立方、12 格 bento。

【v2 从 C 移过来的（两条纪律，不是外观）】
1 · 状态一律三重编码：`字 + 符号 + 颜色`。落点：工具卡状态（… 运行中 / ✓ 成功 / ✗ 失败 / ⊘ 被拒）、
   队列（穿插 ⇢ / 后续 ⇣ 配字与色）、审批（! 待决策 + 倒计时）、引擎与连接状态（AppBar 状态行：
   ✓ 就绪 / … 工作中 / ◌ 启动中 / ≡ 排队中 / ✗ 引擎已退出 / ■ 引擎已停止）、错误块（✗ + 出错了 / 详情）。
   任何只靠颜色表意的地方都补了符号与词；色盲与暗光下仍然可读。
2 · 一屏只有一项用 accent。B 里 accent 用在 6 个地方（底栏激活标签、会话「当前」徽章、发送键、
   收回并编辑、流式光标、审批「允许」），v2 收敛到**每屏恰好一个语义对象**：
     · 对话（空闲）→ 发送键；（流式中）→ 正在跑的那一步（pending 节点 + 流式光标），发送键转中性停止键；
     · 会话列表 → 当前会话（当前徽章 + 选中行左缘 2px 条）；
     · 工作区 → 「本次会话在用」的当前目录卡；
     · 设置首页 → 当前模型卡；设置分组页 → 该行的当前生效值（左缘 2px 条）；
     · Boot → 进度条 / 开始按钮；终端页 → 零 accent（只有 pi 的语法色）。
   被撤掉 accent 的地方全部改由**字号 + 字重 + 1px 线 + 表面阶梯**分层：底栏激活项 = --text + 500 字重
   + 1px 底线；「收回并编辑」= --text + 500 字重；「分叉新会话」= --text；徽章色块默认 --muted。
   层级**不用阴影**；B 的 inset hairline 与 rgba(...,.35) 描边原样保留。

【明确不做】
A 的 12 格 bento / 等距立方 / 屏顶四格读数带；C 的「零图标」（B 的 18px 单线图标保留）；
任何渐变、模糊 / 毛玻璃、辉光、装饰动效、循环动画；任何 π 令牌之外的色相。

【命名（用户 2026 会话更正）】这个 App 叫 **PI**（大写），它里面跑的 agent / CLI 叫 **pi**（小写，上游写法）。
凡界面文案指「这个应用」→ PI（「PI 设备桥」「PI 正在运行」「应用 → PI」）；
指「里面那个 agent」→ pi（「输入 pi 回车」「pi 引擎」「pi 正在总结更早的对话」）。

【排版 / 颜色】颜色 100% 取 pi 主题令牌（brand-spec §2.1 dark + §3 派生表面阶），一个都没有改；
唯一在令牌表外的两个值都是 B 已批准的同一件事：`--body-on-tool #9E9E9E`（App 既有对比度派生 token）
与 rgba(...) 的 alpha（颜色仍是 pi 令牌，只有透明度是 App 侧的）。终端页底色用 --page（App 自己的终端底色
#101014 与 --page 同色系，这里不引入令牌外的值）。字号只有 5 档：12 / 13 / 14 / 15 / 17。

【spec §11 五问】与底座同答案，不另起：对话 = hero；会话列表 = 选择器（覆盖层）；工作区 = 数据（项目现场）；
设置 = 结尾；10cm 单手；冷静·精密；母题 = **执行轨道**（一串工具调用 = 一条线 + 节点上的真实读数）。
v2 给母题加的那一笔，就是 A 的耗时刻度：轨道上的节点从此连"花了多久"都能一眼比出来。

【版面】hero 五台屏横排在最前（对话 / 会话列表覆盖层 / 工作区 / 设置首页 / 设置分组页），每台可交互；
其后接「状态册」12 组、共 57 台同尺寸设备（412×892，darkMode），逐台只改状态。
================================================================================
-->
<style>
  :root{
    /* ---- pi 主题令牌（dark）= 唯一色源，一个都没有改 ---- */
    --accent:#8ABEB7; --border:#5F87FF; --border-accent:#00D7FF; --border-muted:#505050;
    --success:#B5BD68; --error:#CC6666; --warning:#FFFF00;
    --text:#D4D4D4; --muted:#808080; --dim:#666666; --selected-bg:#3A3A4A;
    --user-bg:#343541; --user-text:#D4D4D4;
    --custom-bg:#2D2838; --custom-label:#9575CD;
    --tool-pending:#282832; --tool-success:#283228; --tool-error:#3C2828;
    --tool-title:#D4D4D4; --tool-output:#808080;
    --md-heading:#F0C674; --md-link:#81A2BE; --md-link-url:#666666;
    --md-code:#8ABEB7; --md-codeblock:#B5BD68; --md-codeblock-border:#808080;
    --md-quote:#808080; --md-hr:#808080; --md-bullet:#8ABEB7;
    --diff-add:#B5BD68; --diff-del:#CC6666; --diff-ctx:#808080;
    --syn-comment:#6A9955; --syn-keyword:#569CD6; --syn-function:#DCDCAA;
    --syn-variable:#9CDCFE; --syn-string:#CE9178; --syn-number:#B5CEA8;
    --syn-type:#4EC9B0; --syn-op:#D4D4D4;
    --think-off:#505050; --think-minimal:#6E6E6E; --think-low:#5F87AF;
    --think-medium:#81A2BE; --think-high:#B294BB; --think-xhigh:#D183E8; --think-max:#FF5FFF;
    --bash:#B5BD68;
    --page:#18181E; --card:#1E1E24; --info:#3C3728;
    --surf-low:#1E1E24; --surf:#232329; --surf-high:#29292F; --surf-highest:#303036; --surf-dim:#1C1C22;
    /* 由 toolOutput 抬到 4.5:1 的派生值（App 既有做法 bodyOnTool / contextOnTool） */
    --body-on-tool:#9E9E9E;
    --font-sans:"Geist","Inter","Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    --font-mono:"Geist Mono","JetBrains Mono","Noto Sans Mono","Noto Sans CJK SC",ui-monospace,Menlo,Consolas,monospace;
  }
  html,body{margin:0;padding:0;background:#0e0e12}
  *{box-sizing:border-box}
  .b-page{
    font-family:var(--font-sans); color:var(--text); background:#0e0e12;
    font-synthesis:none; line-break:strict; overflow-wrap:anywhere; text-wrap:pretty;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .b-head{padding:40px 48px 0}
  .b-head-t{font-size:22px;font-weight:600;line-height:1.3;color:var(--text);letter-spacing:-0.01em}
  .b-head-s{font-size:13px;line-height:1.75;color:var(--muted);margin-top:8px;max-width:1180px}
  .b-head-s em{font-style:normal;color:var(--text)}
  .b-head-s b{font-weight:600;color:var(--text)}
  .b-frames{display:flex;gap:32px;flex-wrap:wrap;padding:36px 48px 8px}
  @keyframes bIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes bFade{from{opacity:0}to{opacity:1}}
  @keyframes bRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .b-phone{display:flex;flex-direction:column;gap:10px;animation:bIn .5s cubic-bezier(.2,.7,.3,1) both}
  .b-cap{width:432px}
  .b-cap b{display:block;font-size:13px;font-weight:600;line-height:1.5;color:var(--text)}
  .b-cap span{display:block;font-size:13px;line-height:1.55;color:var(--muted);margin-top:2px}

  /* ---- 状态册：每组一行小标题 + 横排同尺寸设备 ---- */
  .b-board{padding:8px 48px 80px}
  .b-grp{margin-top:30px}
  .b-grp-h{display:flex;align-items:baseline;gap:12px;padding:20px 0 14px;border-top:1px solid var(--border-muted)}
  .b-grp-n{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;flex:none}
  .b-grp-t{font-size:15px;font-weight:600;color:var(--text);flex:none}
  .b-grp-d{font-size:13px;color:var(--muted);flex:1;min-width:0}
  .b-grp-c{font-size:12px;color:var(--muted);flex:none}
  .b-row{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .b-scap{width:432px;display:flex;flex-direction:column;gap:8px;
    animation:bIn .45s cubic-bezier(.2,.7,.3,1) both}
  .b-scap .n{font-size:12px;color:var(--muted);letter-spacing:.06em}
  .b-scap .t{font-size:13px;font-weight:600;color:var(--text);line-height:1.5}
  .b-scap .d{font-size:12px;color:var(--muted);line-height:1.6}

  /* ---- 手机内：一块 412×836 的舞台 ---- */
  .b-root{
    position:relative;width:412px;height:836px;display:flex;flex-direction:column;overflow:hidden;
    background:var(--page);font-family:var(--font-sans);color:var(--text);
    font-synthesis:none;line-break:strict;overflow-wrap:anywhere;
    font-variant-numeric:tabular-nums;text-wrap:pretty;-webkit-font-smoothing:antialiased;
  }
  .b-stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
  .b-screen{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--page)}
  .b-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
  .b-scroll::-webkit-scrollbar{width:3px}
  .b-scroll::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}
  .b-scroll::-webkit-scrollbar-track{background:transparent}
  .b-overlay{position:absolute;inset:0;z-index:6;background:var(--page);display:flex;flex-direction:column;animation:bFade .13s ease both}
  .b-sheetwrap{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;animation:bFade .13s ease both}
  .b-scrim{position:absolute;inset:0;background:rgba(0,0,0,.32)}
  .b-sheet{position:relative;background:var(--surf-high);border-top-left-radius:16px;border-top-right-radius:16px;border-top:1px solid var(--border-muted);max-height:80%;display:flex;flex-direction:column;animation:bRise .16s cubic-bezier(.2,.7,.3,1) both;box-shadow:none}
  .b-dlgwrap{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:22px;animation:bFade .13s ease both}
  .b-dlg{position:relative;width:100%;max-width:330px;background:var(--surf-high);border:1px solid var(--border-muted);border-radius:14px;padding:18px 16px 12px;animation:bRise .16s cubic-bezier(.2,.7,.3,1) both}

  /* ---- 字号 / 颜色工具类（全篇只有 5 档：12 / 13 / 14 / 15 / 17） ---- */
  .t12{font-size:12px;line-height:1.5}
  .t13{font-size:13px;line-height:1.55}
  .t14{font-size:14px;line-height:1.62}
  .t15{font-size:15px;line-height:1.4}
  .t17{font-size:17px;line-height:1.28}
  .w5{font-weight:500}.w6{font-weight:600}
  .mono{font-family:var(--font-mono)}
  .tab{font-variant-numeric:tabular-nums}
  .c-text{color:var(--text)}.c-muted{color:var(--muted)}.c-accent{color:var(--accent)}
  .c-succ{color:var(--success)}.c-err{color:var(--error)}.c-warn{color:var(--warning)}
  .c-link{color:var(--md-link)}.c-head{color:var(--md-heading)}.c-code{color:var(--md-code)}
  .c-body{color:var(--body-on-tool)}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fl1{flex:1;min-width:0}
  .rw{display:flex;align-items:center}
  .press{cursor:pointer}
  .press:hover{background-color:var(--surf)}
  .press2{cursor:pointer}
  .press2:hover{background-color:var(--surf-high)}
  .press3{cursor:pointer}
  .press3:hover{color:var(--text)}
  .b-root input{font-family:inherit;font-size:14px}
  .b-root input::placeholder{color:var(--muted);opacity:1}
  .div{height:1px;background:var(--border-muted);flex:none}
  .hair{height:1px;background:var(--border-muted);opacity:.55;flex:none}

  /* ---- A 的耗时刻度：1px 横线，总长 ∝ log₂(ms)，按量级分段 ---- */
  .tick{display:inline-flex;align-items:center;gap:2px;flex:none}
  .tick i{display:block;height:1px}

  /* ---- 图片网格：无外部图片，用诚实的占位格（label 是 pi 的真实无障碍标签形状） ---- */
  .b-img{position:relative;border:1px solid var(--border-muted);border-radius:8px;background:var(--surf-low);
    display:flex;align-items:center;justify-content:center;text-align:center}

  /* ---- Snackbar：Info = card 底 + 正文色；Warning = info 底 + warning 色；Error = toolError 底 + error 色 ---- */
  .b-snack{position:absolute;left:12px;right:12px;z-index:11;border-radius:12px;padding:10px 12px;
    display:flex;align-items:center;gap:10px;animation:bRise .16s cubic-bezier(.2,.7,.3,1) both}

  /* ---- Boot ---- */
  .b-boot{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 30px;text-align:center}
  .b-boot-badge{width:52px;height:52px;border-radius:999px;border:1px solid var(--border-muted);
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .b-boot-bar{display:flex;gap:2px;width:100%}
  .b-boot-bar i{display:block;height:4px;flex:1;background:var(--border-muted)}

  /* ---- markdown 表格（pi 的 markdown 覆盖了表格：12.5/18 + 8dp 圆角 + 1px 边） ---- */
  .b-tbl{width:100%;border-collapse:collapse;font-size:12px;line-height:18px}
  .b-tbl th,.b-tbl td{border:1px solid var(--border-muted);padding:6px 8px;text-align:left;vertical-align:top}
  .b-tbl th{color:var(--muted);font-weight:500}
</style>
</head>

<!-- ============ 设备框（超话 skill 的 android_frame.jsx，原样内联，未改一行；整体包在 IIFE 里） ============ -->

function AndroidFrame({
  children,
  width = 412,
  height = 892,

  const textColor = darkMode ? '#fff' : '#1a1a1a';

  return (
    <div style={androidFrameStyles.wrapper}>
      <div style={{

            <div style={{

              height: 10,
              border: '1.5px solid currentColor',
              borderRadius: 2,
              padding: 1,
              position: 'relative',

                width: `${battery}%`,

                background: 'currentColor',
                borderRadius: 1,

        <div style={androidFrameStyles.content}>
          {children}
        </div>

        {navStyle === 'gesture' && (
          <div style={androidFrameStyles.navBar}>
            <div style={{
              ...androidFrameStyles.navButton,

        {navStyle === 'buttons' && (

          </div>
        )}
      </div>
    </div>
  );
}

if (typeof window !== 'undefined') {
  window.AndroidFrame = AndroidFrame;
}
})();

<!-- ============ 组件语言（底座原样 + v2 新增：耗时刻度 / 三重编码 / 状态行读数 / 空态 / 浮层） ============ -->
<script type="text/babel" data-presets="react">

      case 'send': return <S s={s} w={p.w}><path d="M9 14.6V4.2M4.4 8.6L9 4l4.6 4.6"/></S>;
      case 'stop': return <S s={s} w={p.w}><rect x="5.2" y="5.2" width="7.6" height="7.6" rx="1.4" fill="currentColor" stroke="none"/></S>;
      case 'filter': return <S s={s} w={p.w}><path d="M3 5.2h12M5.4 9h7.2M7.6 12.8h2.8"/></S>;
      case 'import': return <S s={s} w={p.w}><path d="M9 3v7.4M5.9 7.4L9 10.5l3.1-3.1M3.6 14.2h10.8"/></S>;
      case 'branch': return <S s={s} w={p.w}><path d="M5 3.6v8.4M5 12h5.6a2.4 2.4 0 002.4-2.4V8"/><circle cx="5" cy="3" r="1.4"/><circle cx="13" cy="6.4" r="1.4"/></S>;
      case 'folder': return <S s={s} w={p.w}><path d="M2.8 5.4A1.6 1.6 0 014.4 3.8h2.4l1.4 1.6h5.4a1.6 1.6 0 011.6 1.6v6.2a1.6 1.6 0 01-1.6 1.6H4.4a1.6 1.6 0 01-1.6-1.6z"/></S>;
      case 'file': return <S s={s} w={p.w}><path d="M4.6 3.4h5.2l3.6 3.6v7.6H4.6z"/><path d="M9.6 3.6v3.6h3.6"/></S>;
      case 'terminal': return <S s={s} w={p.w}><path d="M3.4 5.4L6.8 9l-3.4 3.6M9 12.6h5.6"/></S>;
      case 'device': return <S s={s} w={p.w}><rect x="4.6" y="2.6" width="8.8" height="12.8" rx="1.8"/><path d="M7.8 12.8h2.4"/></S>;
      case 'package': return <S s={s} w={p.w}><path d="M9 2.6l5.6 3v6.8L9 15.4 3.4 12.4V5.6z"/><path d="M3.4 5.6L9 8.6l5.6-3M9 8.6v6.8"/></S>;
      case 'key': return <S s={s} w={p.w}><circle cx="6.2" cy="6.2" r="3"/><path d="M8.4 8.4l6 6M12.2 12.2l1.4-1.4M13.9 13.9l1.4-1.4"/></S>;
      case 'shield': return <S s={s} w={p.w}><path d="M9 2.6l5.2 1.8v4.4c0 3.2-2.2 5.4-5.2 6.6-3-1.2-5.2-3.4-5.2-6.6V4.4z"/></S>;
      case 'doc': return <S s={s} w={p.w}><path d="M4.4 3.2h6.2l3 3v8.6H4.4z"/><path d="M6.6 8.4h4.8M6.6 11.2h4.8"/></S>;
      case 'pulse': return <S s={s} w={p.w}><path d="M2.4 9.6h3l1.6-4 2.4 7 1.8-4.6h4.4"/></S>;
      case 'image': return <S s={s} w={p.w}><rect x="2.8" y="3.6" width="12.4" height="10.8" rx="1.6"/><path d="M2.8 11.4l3.4-3 3 2.6 2.6-2.4 3.4 3"/></S>;
      case 'warn': return <S s={s} w={p.w}><path d="M9 3.2l6.2 11H2.8z"/><path d="M9 7.4v3.2M9 12.6v.1"/></S>;
      case 'info': return <S s={s} w={p.w}><circle cx="9" cy="9" r="6"/><path d="M9 8.2v4M9 6.1v.1"/></S>;
      case 'download': return <S s={s} w={p.w}><path d="M9 3v7.4M5.9 7.4L9 10.5l3.1-3.1M3.6 14.2h10.8"/></S>;
      case 'share': return <S s={s} w={p.w}><path d="M9 11V3.4M6.2 6.2L9 3.4l2.8 2.8M4.4 10.6v3.4h9.2v-3.4"/></S>;
      default: return <S s={s} w={p.w}><circle cx="9" cy="9" r="5.4"/></S>;
    }
  }

  /* ---------- 三重编码（C 的纪律）：状态 = 字 + 符号 + 颜色 ---------- */
  /* 工具状态色 = pi 的 warning / success / error；被拒不是失败，用 bodyOnTool（中性、仍有 5.4:1） */
  const ST = {
    pending:  {c:'var(--warning)',      rgb:'255,255,0',    g:'…', w:'运行中', bg:'var(--tool-pending)'},
    success:  {c:'var(--success)',      rgb:'181,189,104',  g:'✓', w:'成功',   bg:'var(--tool-success)'},
    error:    {c:'var(--error)',        rgb:'204,102,102',  g:'✗', w:'失败',   bg:'var(--tool-error)'},
    rejected: {c:'var(--body-on-tool)', rgb:'158,158,158',  g:'⊘', w:'被拒',   bg:'var(--tool-pending)'},
  };
  /* 引擎 / 连接状态：同一套纪律，字是 pi 自己的 engineLabel 词表 */
  const ENGINE = {
    '就绪':      {g:'✓', c:'var(--success)'},
    '工作中':    {g:'…', c:'var(--warning)'},
    '启动中':    {g:'◌', c:'var(--warning)'},
    '排队中':    {g:'≡', c:'var(--warning)'},
    '引擎已退出':{g:'✗', c:'var(--error)'},
    '引擎已停止':{g:'■', c:'var(--error)'},
  };
  function Engine(p){
    const t = p.text || '就绪';
    const e = ENGINE[t] || {g:'…', c:'var(--warning)'};
    return (
      <span className="rw" style={{gap:5,flex:'none',minWidth:0}}>
        <span className="mono t12" style={{color:e.c}}>{e.g}</span>
        <span className="t12 ell" style={{color:'var(--text)'}}>{t}</span>
      </span>
    );
  }

  /* ---------- A 的耗时刻度：1px 横线，总长 ∝ log₂(ms)，按量级分段 ---------- */
  /* <1s 一段 / <10s 两段 / ≥10s 三段；颜色 = 状态色。页脚的文字读数原样保留，刻度只是补充。 */
  function Tick(p){
    const ms = Math.max(p.ms || 0, 1);
    const band = ms < 1000 ? 1 : ms < 10000 ? 2 : 3;
    const total = Math.max(6, Math.min(34, Math.round(Math.log2(ms) * 3.2)));
    const segW = Math.max(2, Math.round((total - (band - 1) * 2) / band));
    return (
      <span className="tick" role="img" aria-label={'耗时 ' + p.ms + ' 毫秒'}>
        {Array.from({length:band}).map((_, i) => (
          <i key={i} style={{width:segW, background:p.color || 'var(--muted)'}}/>
        ))}
      </span>
    );
  }

  /* ---------- 顶栏：chrome 落到 --surf-dim，状态行三重编码 ---------- */
  function TopBar(p){
    return (
      <div style={{flex:'none',background:'var(--surf-dim)',borderBottom:'1px solid var(--border-muted)',padding:'0 14px'}}>
        <div className="rw" style={{height:48,gap:10}}>
          {p.onBack ? (
            <div className="press" onClick={p.onBack} style={{marginLeft:-6,width:32,height:32,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text)'}}>
              <Icon n="left" s={18}/>
            </div>
          ) : null}
          <div className={"fl1"+(p.onTitleClick?" press":"")} onClick={p.onTitleClick}
            style={{minWidth:0,borderRadius:8,cursor:p.onTitleClick?'pointer':'default'}}>
            <div className="rw" style={{gap:6}}>
              <span className="t17 w6 ell" style={{minWidth:0}}>{p.title}</span>
              {p.onTitleClick ? <Icon n="down" s={14} c="var(--muted)"/> : null}
            </div>
            {p.meta ? (
              p.statusMeta
                ? <div style={{marginTop:1}}><Engine text={p.meta}/></div>
                : <div className="t12 c-muted ell" style={{marginTop:1}}>{p.meta}</div>
            ) : null}
          </div>
          <div className="rw" style={{gap:4,flex:'none'}}>{p.right}</div>
        </div>
      </div>
    );
  }

  /* ---------- 底栏：三个目的地。激活项不再用 accent（一屏一个 accent），改用字重 + 1px 底线 ---------- */
  function TabBar(p){
    const items = [
      {k:'chat', label:'对话', n:'chat'},
      {k:'workbench', label:'工作区', n:'workbench'},
      {k:'settings', label:'设置', n:'settings'},
    ];
    return (
      <div style={{flex:'none',height:56,background:'var(--surf-dim)',borderTop:'1px solid var(--border-muted)',display:'flex'}}>
        {items.map(it => {
          const on = p.active === it.k;
          return (
            <div key={it.k} className="press" onClick={()=>p.onChange(it.k)}
              style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,position:'relative'}}>
              <Icon n={it.n} s={20} c={on?'var(--text)':'var(--muted)'}/>
              <span className="t12" style={{color:on?'var(--text)':'var(--muted)',fontWeight:on?500:400}}>{it.label}</span>
              {on ? <span style={{position:'absolute',bottom:6,width:18,height:1,background:'var(--text)'}}/> : null}
            </div>
          );
        })}
      </div>
    );
  }

  /* ---------- 表面 ---------- */
  function Card(p){
    return <div style={{background:p.bg||'var(--surf-low)',borderRadius:10,margin:'0 14px',overflow:'hidden',...p.style}}>{p.children}</div>;
  }
  function Section(p){
    return (
      <div style={{marginTop:18}}>
        <div className="rw" style={{padding:'0 14px',marginBottom:7,gap:8}}>
          <span className="t12 w5" style={{color:'var(--text)',letterSpacing:'.02em'}}>{p.label}</span>
          {p.count!=null ? <span className="t12 c-muted">{p.count}</span> : null}
          <span className="fl1"/>
          {p.aside ? <span className="t12 c-muted">{p.aside}</span> : null}
        </div>
        {p.children}
      </div>
    );
  }
  function Rows(p){
    const kids = React.Children.toArray(p.children).filter(Boolean);
    return (
      <Card>
        {kids.map((c,i)=>(
          <React.Fragment key={i}>
            {i>0 ? <div className="div" style={{marginLeft:p.inset==null?14:p.inset}}/> : null}
            {c}
          </React.Fragment>
        ))}
      </Card>
    );
  }

  /* ---------- 通用行：标题 + 属性（右对齐，tabular） ---------- */
  function Row(p){
    return (
      <div className={p.flat?'press':'press2'} onClick={p.onClick}
        style={{position:'relative',background:p.selected?'var(--selected-bg)':'transparent',padding:'10px 12px',display:'flex',alignItems:'center',gap:10,
          cursor:p.onClick?'pointer':'default'}}>
        {p.accentBar ? <span style={{position:'absolute',left:0,top:8,bottom:8,width:2,background:'var(--accent)'}}/> : null}
        {p.lead ? <span style={{flex:'none',color:'var(--muted)',display:'flex'}}>{p.lead}</span> : null}
        <div className="fl1" style={{minWidth:0}}>
          <div className="rw" style={{gap:7}}>
            <span className={"t15 ell "+(p.mono?'mono t14':'')} style={{fontWeight:p.strong?600:500,color:p.tone||'var(--text)'}}>{p.title}</span>
            {p.badge ? <Badge {...p.badge}/> : null}
          </div>
          {p.meta ? <div className={"t12 c-muted "+(p.metaMono?'mono':'')} style={{marginTop:3,...(p.metaMono?{fontSize:12}:null)}}>{p.meta}</div> : null}

        {p.value!=null ? <span className={"t13 "+(p.valueMono?'mono tab':'')} style={{flex:'none',color:p.valueTone||'var(--text)',textAlign:'right'}}>{p.value}</span> : null}

        {p.trail}
      </div>
    );
  }

  /* ---------- 徽标：色块在最前，字用中性色（可读性优先）；色块默认 --muted，只有该屏 accent 归属者才用 --accent ---------- */
  function Badge(p){
    const c = p.tone || 'var(--muted)';
    return (
      <span className="rw" style={{flex:'none',gap:5,border:'1px solid var(--border-muted)',borderRadius:999,padding:'1px 7px 1px 6px'}}>
        <span style={{width:5,height:5,borderRadius:1,background:c,flex:'none'}}/>
        {p.glyph ? <span className="mono t12" style={{color:c,lineHeight:'16px'}}>{p.glyph}</span> : null}
        <span className="t12" style={{color:'var(--text)',lineHeight:'16px'}}>{p.text}</span>
      </span>
    );
  }

  function Chip(p){
    return (
      <span className={"t12 "+(p.mono?'mono ':'')+(p.onClick?'press':'')} onClick={p.onClick}
        style={{display:'inline-flex',alignItems:'center',gap:5,flex:'none',height:26,padding:'0 9px',borderRadius:999,
          border:'1px solid '+(p.active?'var(--border-accent)':'var(--border-muted)'),
          background:p.active?'var(--surf-high)':'transparent',
          color:p.active?'var(--text)':(p.tone||'var(--text)'),cursor:p.onClick?'pointer':'default'}}>
        {p.glyph ? <span className="mono" style={{color:p.glyphTone||p.tone||'var(--muted)'}}>{p.glyph}</span> : null}
        {p.dot ? <span style={{width:6,height:6,borderRadius:999,background:p.dot,flex:'none'}}/> : null}
        {p.children}
      </span>
    );
  }

  function Switch(p){
    /* 开关不用 accent：「开 / 关」已经由字 + 符号（✓ / ○）+ 轨道形状三重编码，
       所以轨道只用中性阶梯（--text / --surf-highest），把 accent 留给这一屏的语义对象 */
    return (
      <span className="press" onClick={p.disabled?null:()=>p.onChange(!p.on)}
        style={{flex:'none',width:38,height:22,borderRadius:999,background:p.on?'var(--text)':'var(--surf-highest)',
          border:'1px solid '+(p.on?'var(--text)':'var(--border-muted)'),display:'flex',alignItems:'center',
          padding:2,justifyContent:p.on?'flex-end':'flex-start',cursor:p.disabled?'not-allowed':'pointer'}}>
        <span style={{width:16,height:16,borderRadius:999,background:p.on?'var(--page)':'var(--muted)'}}/>
      </span>
    );
  }
  /* Switch 的三重编码：控件本身 + 字（开/关）+ 符号（✓ / ○）—— 只靠颜色不够 */
  function SwitchRow(p){
    return (
      <span className="rw" style={{flex:'none',gap:8}}>
        <span className="rw" style={{gap:5}}>
          <span className="mono t12" style={{color:p.on?'var(--success)':'var(--muted)'}}>{p.on?'✓':'○'}</span>
          <span className="t12" style={{color:'var(--text)'}}>{p.on?'开':'关'}</span>
        </span>
        <Switch on={p.on} onChange={p.onChange}/>
      </span>
    );
  }

  function Seg(p){
    return (
      <div className="rw" style={{gap:2,background:'var(--surf-high)',border:'1px solid var(--border-muted)',borderRadius:8,padding:2,flex:'none'}}>
        {p.items.map(it=>(
          <span key={it.k} className="press t12" onClick={()=>p.onChange(it.k)}

            {it.label}
          </span>
        ))}
      </div>
    );
  }

  /* ---------- 底部 sheet / 对话框（scrim 都是 pi 的 0.32；不加阴影） ---------- */
  function Sheet(p){
    if(!p.open) return null;
    return (
      <div className="b-sheetwrap">
        <div className="b-scrim" onClick={p.onClose}/>
        <div className="b-sheet">
          <div style={{flex:'none',padding:'8px 0 0',display:'flex',justifyContent:'center'}}>
            <span style={{width:32,height:3,borderRadius:999,background:'var(--border-muted)'}}/>
          </div>
          <div style={{flex:'none',padding:'12px 14px 8px'}}>
            <div className="rw" style={{gap:8}}>
              <span className="t15 w6 fl1">{p.title}</span>
              {p.right}
              <div className="press" onClick={p.onClose} style={{width:28,height:28,marginRight:-6,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--muted)'}}>

          {p.footer ? <div className="t12 c-muted" style={{flex:'none',padding:'10px 14px 14px',borderTop:'1px solid var(--border-muted)'}}>{p.footer}</div> : null}
        </div>
      </div>
    );
  }

  function Dialog(p){
    if(!p.open) return null;
    return (
      <div className="b-dlgwrap">
        <div className="b-scrim" onClick={p.onClose}/>
        <div className="b-dlg">
          <div className="rw" style={{gap:7}}>
            {p.glyph ? <span className="mono t14" style={{color:p.glyphTone||'var(--muted)'}}>{p.glyph}</span> : null}
            <span className="t15 w6 fl1">{p.title}</span>

  }

  /* ---------------- 输入区：终端 chip 已按产品裁决去掉 ---------------- */
  function Composer(p){
    const lv = lvOf(p.level);
    const slash = p.draft.startsWith('/') && p.draft.indexOf(' ') < 0;
    const cmds = slash ? B_CMDS.filter(c=>c.n.indexOf(p.draft)===0 || p.draft==='/') : [];

      <div style={{flex:'none',padding:'0 14px 10px'}}>
        {slash ? (
          <div style={{background:'var(--surf-high)',border:'1px solid var(--border-muted)',borderRadius:10,marginBottom:8,overflow:'hidden',animation:'bFade .12s ease both'}}>

                <div key={c.n} className="press2" onClick={()=>setDraft(c.n+(c.a?' ':''))} style={{padding:'8px 12px',cursor:'pointer'}}>

                  <div className="t12 c-muted" style={{marginTop:2}}>{c.d}{c.note||''}</div>
                </div>

            </div>
          </div>
        ) : null}
        <div style={{border:'1px solid '+(draft.startsWith('!')?'var(--bash)':lv.c),borderRadius:14,background:'var(--surf-low)',padding:'9px 10px'}}>

          <div className="rw" style={{gap:6,marginTop:8}}>
            {['/','!','!!','@','图片','编辑器'].map(c=>(

              <Icon n={p.streaming?'stop':'send'} s={16}/>
            </span>
          </div>
        </div>
      </div>

  function SwipeRow(p){
    const [dx, setDx] = React.useState(0);
    const st = React.useRef(null);
    const onDown = e => { st.current = {x:e.clientX, base:dx, moved:false}; try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){} };
    const onMove = e => {
      if(!st.current) return;
      const d = st.current.base + (e.clientX - st.current.x);
      const cl = Math.max(-168, Math.min(0, d));
      if(Math.abs(e.clientX - st.current.x) > 4) st.current.moved = true;
      setDx(cl);
    };
    const onUp = () => { if(!st.current) return; const moved = st.current.moved; setDx(d=>d<-56?-168:0); st.current=null; if(!moved) p.onSelect(); };
    return (
      <div style={{position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:0,bottom:0,right:0,display:'flex',width:168}}>
          <div className="press2" onClick={()=>{setDx(0);p.onSelect();}}
            style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--surf-highest)',cursor:'pointer'}}>

          </div>
          <div className="press2" onClick={()=>{setDx(0);p.onDelete();}}
            style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'var(--surf-highest)',borderLeft:'1px solid var(--border-muted)',cursor:'pointer'}}>
            <span className="t12 c-err">✗ 删除</span>
          </div>
        </div>
        <div onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}

    const all = B_SESSIONS.reduce((a,g)=>a.concat(g.rows.map(r=>Object.assign({g:g.g},r))),[]);
    const hit = all.filter(r=>(!q || (r.t+r.sub+r.prop).indexOf(q)>=0) && (!onlyNamed || r.prop.indexOf('已命名')>=0));
    const groups = B_SESSIONS.map(g=>({g:g.g, rows:hit.filter(r=>r.g===g.g)})).filter(g=>g.rows.length);
    const isEmpty = p.empty==='no-sessions';

      <div className="b-overlay">
