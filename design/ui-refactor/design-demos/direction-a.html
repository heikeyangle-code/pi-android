<title>pi · UI 重构方向 A · 读数轨</title>

<!--
================================================================================
方向 A · 秒数轮盘 #16 —— Terminal-Core Soft-Futurism（等宽字 + 等距立方）
参照物：Cursor 的开发者终端美学 × Teenage Engineering 工业极简
本版取向：「仪表」——信息以「读数 + 轨道」组织，对话流是一条带读数的执行轨道
配色：只用 pi 主题令牌（brand-spec §2.1 dark + §3 派生表面阶），无渐变/无模糊/无辉光
================================================================================

── spec §11 · form 推导五问（逐条作答） ───────────────────────────────────────

1) 叙事角色
   对话 = hero（整条执行轨道 + 顶部的横读数带）；会话列表 = 索引入口（读数化的行）；
   工作区 = 数据（这个会话的项目现场，等距底板 + 读数格）；设置首页 = 结尾（索引）；
   设置分组页 = 结尾的细节页（一行一台仪器）。角色决定密度：hero 最高，索引页次之。

2) 观众距离
   10cm 手机。正文 14px（等宽读数同档）、标签/读数标签 12px、行高 1.45。
   一屏要放下 6–8 个块 → 靠 16px 块距 + 24px 轨道缩进，而不是给每块套一张 16dp 圆角卡片。
   圆角从「卡片语言」收敛到 8（分区）/4（chip），把层级交给发丝线与读数。

3) 视觉温度
   冷静 · 精密（仪器面板）。暖白 --text 落在炭黑 --page 上，全屏平铺、只在需要内容容器时
   才抬起一个表面阶（工具卡用 pi 的状态底色、sheet 用 --surf-high）。唯一的「热」是状态：
   success / error / warning 与思考等级色温刻度。温度差全部由字号与发丝线承担。

4) 容量估算（先画 3 个 5 秒 thumbnail）
   缩略 1 · 对话：一条竖轨 + 8 个节点方块 + 右侧读数 → 塞得下，每块平均 70px（1 行等宽头 + 1 行读数）。
   缩略 2 · 设置首页：4 格横读数带 + 当前模型卡（含 7 段色温刻度）+ 12 格 bento → 一屏内基本可见。
   缩略 3 · 工作区：一块等距底板 + 4 个读数格 → 不空，因为每格都有真实读数（调用次数/痕迹/资源/运行时）。
   结论：对话页一屏 6–8 块可行；工具卡折叠态 46px、展开态按真实行数增长。

5) 视觉母题：**读数轨（readout rail）**
   来自内容哪里：pi 的每个工具块本身就是三段式——「工具名 / 状态符号 / 页脚读数（成功 · 132ms · 13 行）」。
   本版把这三段放大成一套仪器语法：
     · 竖轨 = 一次会话的执行轨道，14 种块是同一条轨上的节点（节点形状 = 块类型，节点色 = 状态）；
     · 节点右侧 6px 刻度线 = 尺规语法，整条轨读起来像一条带刻度的记录纸；
     · 块脚右端的 1px 横线长度 ∝ log2(耗时) = 时间轴（132ms 与 6.4 秒一眼可比）；
     · 屏幕顶部同族的**横读数带**（label 12px + 值 14px tabular-nums，格间 1px 发丝线）＝ 状态行的仪器化；
     · 工作区用同一族的等距底板表达「项目现场」的层次（等距 = 把目录/资源/会话三层叠起来看）。
   母题复用到的真实 token：PiSpacing.contextRing(20dp/2dp)、errorDot、stripe、hairline、
   toolDiffAdded/Removed/Context、thinking(level) 七级色温。

── 假设（写下来以便复核） ────────────────────────────────────────────────────
· **导航按 03-navigation-decision.md 的裁决**：底栏三项 = 对话 / 工作区 / 设置；
  会话列表是覆盖层（从对话页左上角会话名进入，列表 ↔ 会话树 同层切换，新建会话也在这里）；
  终端降格为设置首页里的一个入口行（与 设备 / 扩展 / 关于 同级），点进去是全屏终端页。
  竖屏手机不做两栏；≥600dp 宽屏才把「项目现场」与终端并排（页内已用 12px 注明）。
· 工作区选 **候选 A：这个会话的项目现场**。只用 pi 真实可读的东西：会话工作目录末段、
  .pi 资源清单计数（技能 / 提示模板 / 扩展 / 资源包 / 主题，值是分组副行的真实形态）、
  git 分支名与「本次会话改过/新建」的文件（改动清单来自转录里的 read/edit/write/diff 卡，
  页内 12px 已注明「git 侧只读到分支名」，不发明文件树、不发明 git 的改动行数）、
  运行时只读行与保活/离线开关。
· 品牌禁区与裁决冲突的处理：裁决要求设置首页有「终端」入口行，故该处按裁决保留「终端」字样；
  其余位置不出现终端入口。设置分组标题「终端与 Shell」显示为「Shell」、行「终端字号」写作
  「等宽字号」（值 13 与源一致）、会话示例标题里的「终端」二字去掉。
· 块类型以 02-real-content §0 为唯一权威：没有 todo / 待办 / plan / 子代理块，
  也**没有复选方框**；「清单」以助手正文里的真实 markdown 有序列表呈现（块 28 的 1./2.）。
· edit 卡与 diff 卡是两张不同的卡（02 块 08 / 块 09），本版不合并。
· 「没有响应」这句话源码里不存在，本版不写；用「状态行停在工作中 + 壳卡页脚停在
  已运行 12.3 秒 + 回到最新悬浮」三种真实表现表达假死。
· 进行中态：AppBar 状态行「工作中」、通用工具卡「运行中 …」、Shell 页脚
  「运行中 · 已运行 12.3 秒 · 18 行」、压缩块「正在压缩上下文…」。光标按 §9 只做静态呈现
  （不写循环动画），形状与色值照 AssistantTextBlock 的 8×16 / accent 0.65。
· 工具卡与 diff 正文里的路径/类名是 pi 自己的输出（02 素材，逐字引用），不算界面文案；
  界面 chrome 层（标题、副行、说明、空态、设置行）零路径、零类名。
· 用户消息正文里的长句按 412px 宽度重新折行，文字逐字不改。
· 会话行的 12 条标题/数字沿用 02 §1.4 的示例形状（该表已标注「标题与数字为编造」）。
· 工具卡名 `notes_lookup`、参数摘要 `scope=session`（块 25 通用回退卡）与 diff 的 +5/−2
  是本版为自洽而编的示例（02 该处标注为示例）；块 23 的 +5 −2 与 diff 保持一致。
· 对比度纪律：--muted(#808080) 只落在 --page(#18181E) 上（4.5:1）；任何抬起的表面上，
  次级信息改用 --text 12px + 发丝线，靠字号而非颜色做层级（令牌里没有更亮的次级灰）。
  状态色只用于字形/色条/刻度（非文本对比 ≥3:1），正文一律 --text。

── 交互（每台都是一份完整 App 的独立状态机，初值不同） ────────────────────────
底栏三项每台内都能切；对话页左上角会话名 → 会话列表覆盖层（列表 / 会话树 / 无会话 / 无匹配）；
开场滚到 edit 卡（用 offsetTop 定位，不猜像素）：一屏里同时看到 edit 卡、真实 diff、
write 卡、bash 成功卡的输出与耗时刻度、以及下一张 pending 卡；
工具卡点击展/收；diff 展/收；审批行 → 弹窗（允许/拒绝 + 倒计时 + 排队数）；
用户消息 → 动作菜单；模型 chip → 选择模型 sheet；思考 chip → 思考等级 sheet（点击循环）；
队列行 → 会话与队列 sheet；更多 → 溢出菜单 sheet；会话信息 sheet；`/` → 命令面板 sheet；
`!` → 命令输出面板 sheet；搜索 → 对话内查找条；转录上滑 → 回到最新悬浮；
工作区开关；设置：搜索页、12 格 bento 可点进分组页、6 种行型的编辑器 sheet、危险行确认框、
终端入口 → 全屏终端页。
================================================================================

/* 状态字形（源码：运行中 … / 成功 ✓ / 失败 ✗，且状态永远是「词 + 符号」） */
function StateGlyph({state, size}) {
  const map = {ok:{g:'✓', c:T.success}, err:{g:'✗', c:T.error}, run:{g:'…', c:T.warning}};
  const s = map[state] || map.ok;

/* 耗时刻度：1px 横线，长度 ∝ log2(ms) —— 时间轴读数 */
function Tick({ms, color, width}) {
  const w = width || Math.max(6, Math.min(38, Math.round(Math.log2(Math.max(ms||2,2)) * 4)));
  return <span style={{display:'inline-block', width:w, height:1, background:color||T.muted, verticalAlign:'middle'}} />;
}

/* 上下文环（PiSpacing.contextRing = 20dp / stroke 2dp），静态 */
function Ring({pct, size}) {
  const s = size || 20, r = (s - 2) / 2 - 1, c = 2 * Math.PI * r;
  return (
    <svg width={s} height={s} viewBox={'0 0 '+s+' '+s} style={{flex:'0 0 auto', display:'block'}}>
      <circle cx={s/2} cy={s/2} r={r} fill="none" stroke={T.borderMuted} strokeWidth="2" />
      <circle cx={s/2} cy={s/2} r={r} fill="none" stroke={T.accent} strokeWidth="2"
        strokeDasharray={(c*pct/100).toFixed(2)+' '+c.toFixed(2)}
        transform={'rotate(-90 '+s/2+' '+s/2+')'} />
    </svg>
  );
}

/* 横读数带：格间 1px 发丝线；label 12px（落 --page 上，4.5:1）+ 值 14px tabular */
function Readout({cells, lead, style}) {

function Btn({children, onClick, tone, active, pad, style, title}) {

function Seg({items, value, onChange}) {

/* ============================ 屏 2 · 会话列表（覆盖层） ============================ */
function Sessions({view, mode, setMode, onClose}) {
  const [q, setQ] = useState('');
  const [sort, setSort] = useState('time');     /* time | name */
  const [filter, setFilter] = useState('all');  /* all | named */
  const [sel, setSel] = useState(1);
  const [dialog, setDialog] = useState(null);   /* actions | delete | deleteCur */

  const grouped = useMemo(() => {
    let rows = SESSION_ROWS.slice();
    if (filter === 'named') rows = rows.filter(r => r.named);
    if (q.trim()) {
      const s = q.trim().toLowerCase();
      rows = rows.filter(r => (r.title + r.g + (r.model || '')).toLowerCase().indexOf(s) >= 0);
    }
    if (sort === 'name') rows = rows.slice().sort((a, b) => a.title.localeCompare(b.title, 'zh'));
    const order = [];
    rows.forEach(r => { if (order.indexOf(r.g) < 0) order.push(r.g); });
    return order.map(g => ({g, rows: rows.filter(r => r.g === g)}));
  }, [q, sort, filter]);

  const total = grouped.reduce((n, x) => n + x.rows.length, 0);
  const cur = SESSION_ROWS.filter(r => r.cur)[0];

  return (
    <div style={{flex:'1 1 auto', minHeight:0, display:'flex', flexDirection:'column', background:T.page, position:'relative'}}>
      <div style={{display:'flex', alignItems:'center', gap:8, padding:'10px 16px 8px'}}>

/* 等距投影：x' = (x - y) * 0.866, y' = (x + y) * 0.5 - z（手搓，SVG 内联，无渐变） */
function IsoStack() {
  const sc = 30, ox = 168, oy = 138;
  const P = (x, y, z) => [((x - y) * 0.866 * sc + ox).toFixed(1), ((x + y) * 0.5 * sc - z * sc + oy).toFixed(1)];
  const poly = arr => arr.map(p => p.join(',')).join(' ');
  const S = 2.2;                                  /* 底板边长（单位） */
  const slabs = [
    {z0:0.0, z1:0.9, n:'1'},
    {z0:1.6, z1:2.5, n:'2'},
    {z0:3.2, z1:4.1, n:'3'},
  ];
  const faces = sl => ({
    left: poly([P(0, S, sl.z1), P(S, S, sl.z1), P(S, S, sl.z0), P(0, S, sl.z0)]),
    right: poly([P(S, 0, sl.z1), P(S, S, sl.z1), P(S, S, sl.z0), P(S, 0, sl.z0)]),
    top: poly([P(0, 0, sl.z1), P(S, 0, sl.z1), P(S, S, sl.z1), P(0, S, sl.z1)]),
    edge: [P(S, 0, sl.z1), P(S, S, sl.z1)],
  });
  const gridOn = (z) => {
    const out = [];
    for (let i = 1; i <= 3; i++) {
      const t = (S * i) / 4;
      out.push(poly([P(t, 0, z), P(t, S, z)]));
      out.push(poly([P(0, t, z), P(S, t, z)]));
    }
    return out;
  };
  return (
    <svg width="212" height="196" viewBox="0 0 212 196" style={{display:'block', flex:'0 0 auto'}}>
      {slabs.map((sl, i) => {
        const f = faces(sl);
        return (
          <g key={i}>
            <polygon points={f.left} fill={T.surf} stroke={T.borderMuted} strokeWidth="1" />
            <polygon points={f.right} fill={T.sDim} stroke={T.borderMuted} strokeWidth="1" />
            <polygon points={f.top} fill={T.sHighest} stroke={T.borderMuted} strokeWidth="1" />
            {gridOn(sl.z1).map((g, j) => <polyline key={j} points={g} fill="none" stroke={T.borderMuted} strokeWidth="1" opacity="0.55" />)}
            <polyline points={f.edge[0].join(',') + ' ' + f.edge[1].join(',')} fill="none" stroke={T.borderMuted} strokeWidth="1" />
          </g>
        );
      })}
      {slabs.map((sl, i) => {
        const a = P(S, S * 0.5, sl.z1);
        const bx = (parseFloat(a[0]) + 14).toFixed(1), by = (parseFloat(a[1]) + 4).toFixed(1);
        return (
          <g key={'l' + i}>
            <line x1={a[0]} y1={a[1]} x2={bx} y2={by} stroke={T.borderMuted} strokeWidth="1" />
            <text x={(parseFloat(bx) + 4).toFixed(1)} y={(parseFloat(by) + 4).toFixed(1)} fill={T.text}
              style={{fontFamily:'var(--font-mono)', fontSize:12}}>{sl.n}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* 设置搜索页（快捷词 + 结果 + 空态） */
function SearchSheet({open, onClose, onOpen}) {
  const [f, setF] = useState('');
  const HINTS = ['reserveTokens', 'thinkingBudgets', 'theme'];
  const hits = [];
  Object.keys(GROUP_ROWS).forEach(gid => GROUP_ROWS[gid].forEach(r => {
    if (f.trim() && (r.title + (r.value || '')).toLowerCase().indexOf(f.trim().toLowerCase()) >= 0) hits.push({gid, r});
  }));
  return (
    <Sheet open={open} title="搜索设置" sub="匹配标题、说明与字段名" onClose={onClose} maxH="80%">
      <div style={{padding:'4px 16px 8px'}}>
        <input className="mono" value={f} onChange={e => setF(e.target.value)} placeholder="标题 · 说明 · 字段名" autoFocus
          style={{width:'100%', fontSize:14, lineHeight:'20px', borderBottom:'1px solid '+T.borderMuted, paddingBottom:6, color:T.text}} />
        <div style={{display:'flex', gap:6, marginTop:10, flexWrap:'wrap'}}>
          {HINTS.map(h => <Btn key={h} onClick={() => setF(h)}>{h}</Btn>)}
        </div>
      </div>
      {!f.trim() ? (
        <div className="pretty" style={{fontSize:14, lineHeight:'21px', padding:'10px 16px', color:T.text}}>搜索全部 68 项设置。匹配标题、说明与字段名，斜杠命令也能用。</div>
      ) : hits.length === 0 ? (
        <div style={{padding:'10px 16px'}}>
          <div style={{fontSize:14, lineHeight:'20px'}}>没有匹配的设置</div>
          <div className="pretty" style={{fontSize:14, lineHeight:'21px', marginTop:4}}>试试字段名（reserveTokens、sessionDir），或者斜杠命令（/compact、/tree）。</div>
        </div>
      ) : (
        <React.Fragment>
          <div className="mono" style={{fontSize:12, lineHeight:'16px', color:T.text, padding:'6px 16px'}}>{hits.length} 条结果</div>
          {hits.map((h, i) => (
            <button key={i} onClick={() => onOpen(h.gid)} className="hvrow" style={{display:'flex', alignItems:'baseline', gap:10, width:'100%', textAlign:'left', padding:'10px 16px', borderTop:'1px solid '+T.borderMuted, cursor:'pointer'}}>
              <div style={{flex:'1 1 auto', minWidth:0}}>
                <div style={{fontSize:14, lineHeight:'20px'}}>{h.r.title}</div>

              <span className="mono" style={{fontSize:12, lineHeight:'16px', color:T.muted}}>›</span>
            </button>

  );

        })}
        <div style={{height:24}} />

      <Dialog open={!!dlg && !!dlg.kind.oauth} title={dlg ? dlg.kind.title : ''}
        body="订阅登录要在 pi 的原版 TUI 里做，本应用没有入口。用 API Key 的厂商可以在上面的「API Key」里配置。"

        body="这个入口当前不可用。" primary="知道了" onPrimary={() => setDlg(null)} onClose={() => setDlg(null)} />

/* 编辑器 sheet：Value / Number / Text / List 四种（真实说明文案） */
function EditorSheet({edit, onClose, onSave}) {
  const [v, setV] = useState('');
  const [f, setF] = useState('');
  useEffect(() => {
    if (edit) { setV(edit.kind.value === '未设置' ? '' : edit.kind.value); setF(''); }
  }, [edit]);
  if (!edit) return null;
  const r = edit.kind;
  const title = r.title;
  const OBJ_DOC = '每行一项，写成「键 = 值」，键按精确匹配不认通配符。值以 { 或 [ 开头时按 JSON 解析，例如逐模型压缩覆盖写成 model-id = {"reserveTokens": 400000}，其余按字符串/数字/布尔解析。';
  const ARR_DOC = '每行一项，支持 glob 与排除标记：!pattern 排除、+path 强制包含、-path 强制排除。值以 { 或 [ 开头时按 JSON 解析，例如 packages 的对象形式 {"source": "pi-skills", "autoload": false}。';
  const opts = (r.options || []).filter(o => o.toLowerCase().indexOf(f.toLowerCase()) >= 0);
  return (
    <Sheet open title={title} sub={r.k === 'number' ? '数字' : (r.k === 'list' ? '清单' : (r.k === 'text' ? '文本' : '选项'))} onClose={onClose} maxH="76%"
      footer={<div style={{display:'flex', gap:8, padding:'10px 16px 12px'}}>
        <Btn onClick={() => onSave(v)} active style={{padding:'7px 14px'}}>确定</Btn>
        <Btn onClick={onClose} style={{padding:'7px 14px'}}>取消</Btn>
      </div>}>
      {r.k === 'value' ? (
        <React.Fragment>
          <div style={{padding:'2px 16px 8px'}}>
            <input className="mono" value={f} onChange={e => setF(e.target.value)} placeholder="筛选选项，或直接输入自定义值"
              style={{width:'100%', fontSize:14, lineHeight:'20px', borderBottom:'1px solid '+T.borderMuted, paddingBottom:6, color:T.text}} />
          </div>
          {opts.map((o, i) => (
            <button key={o} onClick={() => setV(o)} className="hvrow" style={{display:'flex', alignItems:'center', gap:10, width:'100%', textAlign:'left', padding:'11px 16px', borderTop:i ? '1px solid '+T.borderMuted : 'none', cursor:'pointer'}}>
              <span className="mono" style={{fontSize:14, lineHeight:'20px', flex:'1 1 auto', minWidth:0, color:o === v ? T.accent : T.text}}>{o}</span>
              {o === v ? <span className="mono" style={{fontSize:12, lineHeight:'16px', color:T.accent}}>当前</span> : null}
            </button>
          ))}
          <div className="mono" style={{fontSize:12, lineHeight:'16px', color:T.text, padding:'10px 16px'}}>未设置时显示「未设置」；不在选项表里的值原样显示。</div>
        </React.Fragment>
      ) : r.k === 'number' ? (
        <div style={{padding:'6px 16px 10px'}}>
          <input className="mono" value={v} onChange={e => setV(e.target.value)} inputMode="numeric"
            style={{width:'100%', fontSize:28, lineHeight:'34px', color:T.text, borderBottom:'1px solid '+T.borderMuted, paddingBottom:6}} />
          <input type="range" min="-4" max="8" value={Number(v) || 0} onChange={e => setV(e.target.value)}
            style={{width:'100%', marginTop:16, accentColor:T.accent}} />
          <div style={{display:'flex', justifyContent:'space-between'}} className="mono">
            <span style={{fontSize:12, color:T.text}}>−4</span>
            <span style={{fontSize:12, color:T.text}}>+8</span>
          </div>
        </div>
      ) : r.k === 'text' ? (
        <div style={{padding:'6px 16px 10px'}}>
          <input className="mono" value={v} onChange={e => setV(e.target.value)} placeholder="未设置"
            style={{width:'100%', fontSize:14, lineHeight:'20px', color:T.text, borderBottom:'1px solid '+T.borderMuted, paddingBottom:8}} />
        </div>
      ) : (
        <div style={{padding:'6px 16px 10px'}}>
          <textarea className="mono" value={v} onChange={e => setV(e.target.value)} rows={5}
            style={{width:'100%', fontSize:14, lineHeight:'20px', color:T.text, border:'1px solid '+T.borderMuted, borderRadius:8, padding:10, resize:'none'}} />
          <div className="pretty" style={{fontSize:12, lineHeight:'17px', color:T.text, marginTop:10}}>{r.listKind === 'array' ? ARR_DOC : OBJ_DOC}</div>
        </div>
      )}

  );
}

function PiApp({initial}) {

  const [seen, setSeen] = useState({[cfg.dest || 'chat']: true});
  const go = d => { setSeen(s => (s[d] ? s : {...s, [d]: true})); setDest(d); };

}

<script type="text/babel" data-presets="react">
/* 每个 <script type="text/babel"> 共享同一个全局作用域，同名顶层 const 会
   「Identifier has already been declared」而整页白屏（skill 技术红线第 2 条）。
   所以每块自己包一层 IIFE：内部名字互不可见，只通过 Object.assign(window,…) 交换。 */
(function () {
const {useState, useRef, useEffect, useMemo} = React;
const {AndroidFrame, PiApp} = window;

function Chip({on, onClick, children}) {
  return <button className={'chip' + (on ? ' on' : '')} onClick={onClick}>{children}</button>;
}

function Frame({idx, name, note, chips, children}) {
  return (
    <div className="fcol">
      <div className="cap">
        <b>{idx}</b>
        <span>{name}</span>
        {note ? <span>· {note}</span> : null}
        {chips}
      </div>
      <AndroidFrame width={412} height={892} darkMode time="9:41" battery={78}>{children}</AndroidFrame>
    </div>
  );
}

function Demo() {

  return (

      </div>

      <div className="frames">

        <Frame idx="01" name="对话（hero）" note="执行轨道：节点 = 块类型，节点色 = 状态，右端 1px 刻度 ∝ log₂ 耗时">

          chips={<React.Fragment>
            <Chip on={ov.view === 'list' && ov.mode === 'list'} onClick={() => setOv({view:'list', mode:'list'})}>列表</Chip>
            <Chip on={ov.view === 'empty1'} onClick={() => setOv({view:'empty1', mode:'list'})}>空态 · 无会话</Chip>
            <Chip on={ov.view === 'empty2'} onClick={() => setOv({view:'empty2', mode:'list'})}>空态 · 无匹配</Chip>
            <Chip on={ov.mode === 'tree'} onClick={() => setOv({view:'list', mode:'tree'})}>会话树</Chip>
          </React.Fragment>}>
          <PiApp key={ov.view + ov.mode} initial={{dest:'chat', overlay:true, overlayState:{view:ov.view, mode:ov.mode}}} />
        </Frame>

        <Frame idx="03" name="工作区（项目现场）" note="工作区选候选 A：cwd · .pi 资源 · git 改动 · 本次会话痕迹（竖屏不做两栏）">
          <PiApp initial={{dest:'workbench'}} />

          <PiApp initial={{dest:'settings'}} />
        </Frame>

        <Frame idx="05" name="设置分组页" note="6 种行型：开关 / 动作（含危险）/ 取值 / 数字 / 文本 / 清单 + 生效徽标"
          chips={<React.Fragment>
            <Chip on={g5 === 'model'} onClick={() => setG5('model')}>模型与推理</Chip>
            <Chip on={g5 === 'appearance'} onClick={() => setG5('appearance')}>外观</Chip>
            <Chip on={g5 === 'shell'} onClick={() => setG5('shell')}>Shell</Chip>
            <Chip on={g5 === 'security'} onClick={() => setG5('security')}>安全与信任</Chip>
          </React.Fragment>}>
          <PiApp key={g5} initial={{dest:'settings', settings:{group:g5}}} />
        </Frame>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
})();
</script>
