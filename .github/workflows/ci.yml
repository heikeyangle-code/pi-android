name: ci

on:
  push:
    branches: [main, 'proroot-*']
    paths-ignore:
      - '**.md'
      - 'docs/screenshots/**'
      - 'brand/**/*.svg'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/screenshots/**'
      - 'brand/**/*.svg'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol core (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test :rpc
        run: ./gradlew :rpc:test --console=plain
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-test-report
          path: rpc/build/reports/tests/test
          if-no-files-found: ignore

  sdk-host:
    name: SDK Host (real Pi SDK contract & tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Cache the pinned engine
        uses: actions/cache@v4
        with:
          path: build/pi-contract
          key: pi-contract-${{ hashFiles('tools/fetch-runtime.mjs') }}
      - name: Install the pinned engine
        run: |
          version="$(node -e 'const t=require("fs").readFileSync("tools/fetch-runtime.mjs","utf8");process.stdout.write(/const PI_VERSION = "([^"]+)"/.exec(t)[1])')"
          mkdir -p build/pi-contract
          ( cd build/pi-contract && npm install --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$version" )
          test -d "build/pi-contract/node_modules/@earendil-works/pi-coding-agent/dist"
      - name: sdk-host contract (SDK surface the host depends on)
        run: node tools/sdk-host/contract.mjs
      - name: sdk-host behaviour (bundle entry)
        run: node tools/sdk-host/test.mjs
      - name: sdk-host behaviour (package fallback)
        run: node tools/sdk-host/test.mjs --no-bundle
      - name: sdk-host behaviour (proroot scandir patch)
        run: node tools/sdk-host/test.mjs --scandir-fix

  static-guards:
    name: Static safety guards (Kotlin & Android APIs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject nested Kotlin block comments
        run: python3 tools/check-nested-comments.py
      - name: Reject Java 11+ APIs Android runtime does not have
        run: bash tools/check-android-apis.sh
      - name: Verify i18n XML parity & format specifiers
        run: node tools/check-i18n.mjs

  tawcroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Ensure an NDK is available
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK at $SDK"
            exit 1
          fi
          if ! ls -d "$SDK"/ndk/* >/dev/null 2>&1; then
            sdkm="$(command -v sdkmanager || find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
            [ -n "$sdkm" ] || { echo "::error::no sdkmanager under $SDK"; exit 1; }
            yes 2>/dev/null | "$sdkm" --licenses >/dev/null 2>&1 || true
            yes 2>/dev/null | "$sdkm" --install "ndk;27.2.12479018" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls -d "$SDK"/ndk/* || { echo "::error::still no NDK under $SDK/ndk"; exit 1; }
      - name: Build libtawcroot.so from the pinned tag
        run: bash tools/build-tawcroot.sh "$RUNNER_TEMP/tawcroot-out"
      - uses: actions/upload-artifact@v4
        with:
          name: libtawcroot
          path: ${{ runner.temp }}/tawcroot-out/libtawcroot.so

  apk:
    name: APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: tawcroot
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sideload28
            targetSdk: 28
          - variant: modern36
            targetSdk: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libtawcroot
          path: app/src/main/jniLibs/arm64-v8a
      - name: Assert the runtime binary is in the APK inputs
        run: |
          ls -l app/src/main/jniLibs/arm64-v8a/libtawcroot.so
          file app/src/main/jniLibs/arm64-v8a/libtawcroot.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Ensure an Android SDK is on the environment
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK found at $SDK on this runner"
            exit 1
          fi
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          } >> "$GITHUB_ENV"
          yes 2>/dev/null | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache upstream artifacts
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: pi-runtime-downloads-${{ hashFiles('runtime.lock.json') }}
          restore-keys: pi-runtime-downloads-
      - name: Assemble runtime (proot, Ubuntu, Node, rg/fd, pi)
        run: |
          sudo apt-get install -y -qq dpkg-dev xz-utils
          node tools/fetch-runtime.mjs
      - name: Assemble arm64 release APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -Ppi.targetSdk=${{ matrix.targetSdk }} \
            -Pkotlin.daemon.jvmargs=-Xmx2g \
            --console=plain 2>&1 | tee /tmp/assemble.log
      - name: Report Kotlin errors as annotations
        if: failure()
        run: |
          grep -E "^e: file://|error: " /tmp/assemble.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Report APK size
        run: |
          ls -lh app/build/outputs/apk/release/
          find app/build/outputs/apk -name '*.apk' -printf '%f %s bytes\n'
      - name: Verify the release APK is signed with the sideload key
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${SDK:-}}"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::no apksigner under ${sdk:-<unset SDK>}/build-tools"
            exit 1
          fi
          mapfile -t all < <(ls app/build/outputs/apk/release/*.apk 2>/dev/null || true)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "::error::no APK under app/build/outputs/apk/release"
            exit 1
          fi
          for f in "${all[@]}"; do
            case "$f" in
              *unsigned*)
                echo "::error::assembleRelease produced $f; signingConfig did not apply"
                exit 1
                ;;
            esac
          done
          apk="${all[0]}"
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner.txt
          expected=b12b3607b5978386c13a55a47020fd95750fa6f9db048cdf6148661c05a09c7c
          if ! grep -qi "$expected" /tmp/apksigner.txt; then
            echo "::error::$apk is not signed with keystore/pi-sideload.jks"
            exit 1
          fi
      - name: Verify runtime payloads are stored uncompressed
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          apk_bytes="$(stat -c %s "$apk")"
          if ! unzip -l "$apk" | grep -qE 'lib/arm64-v8a/libtawcroot\.so'; then
            echo "::error::$apk has no lib/arm64-v8a/libtawcroot.so"
            exit 1
          fi
          staged=app/src/main/assets/runtime
          unzip -lv "$apk" | awk '$8 ~ /^assets\/runtime\// { print $1, $2, $8 }' | sort -k3 > /tmp/apk-payloads.txt
          for f in "$staged"/*; do
            printf '%s %s %s\n' "$(stat -c %s "$f")" Stored "assets/runtime/$(basename "$f")"
          done | sort -k3 > /tmp/staged-payloads.txt
          fail=0
          if [ "$(wc -l < /tmp/apk-payloads.txt)" -lt 5 ]; then
            echo "::error::expected at least five runtime payloads in the APK"
            fail=1
          fi
          if ! diff -u /tmp/staged-payloads.txt /tmp/apk-payloads.txt; then
            echo "::error::the APK's runtime payloads differ from staged files"
            fail=1
          fi
          if [ "$apk_bytes" -gt $((200 * 1024 * 1024)) ]; then
            echo "::error::APK is $((apk_bytes / 1024 / 1024)) MiB, over the 200 MiB ceiling"
            fail=1
          fi
          rev="$(unzip -p "$apk" assets/runtime-revision.txt 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "${#rev}" -ne 16 ]; then
            echo "::error::assets/runtime-revision.txt missing or invalid: '${rev}'"
            fail=1
          fi
          exit "$fail"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-android-${{ matrix.variant }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
